<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d3557">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Judo-reisen">
<title>Haralds judo-reise i Japan 🥋</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥋</text></svg>">
<style>
:root{
  --bg:#fdf6ec; --ink:#1d2433; --muted:#6b7280; --card:#ffffff;
  --red:#d62828; --blue:#1d4ed8; --navy:#1d3557; --green:#2a9d8f; --gold:#f4a261;
  --ok:#16a34a; --bad:#dc2626; --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP","Noto Sans CJK JP","Yu Gothic",sans-serif;
  background:var(--bg) radial-gradient(circle at 85% -10%, #ffd6d6 0, transparent 40%);color:var(--ink);
  max-width:520px;margin:0 auto;padding:0 14px calc(24px + env(safe-area-inset-bottom));}
.jpfont{font-family:"Hiragino Sans","Noto Sans JP","Noto Sans CJK JP","Yu Gothic","Meiryo",system-ui,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 8px}
header h1{font-size:1.15rem;margin:0;line-height:1.2}
header h1 small{display:block;font-weight:500;color:var(--muted);font-size:.8rem}
.iconbtn{border:0;background:#fff;border-radius:50%;width:42px;height:42px;font-size:1.25rem;box-shadow:0 2px 6px #0001;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 12px}
.stat{background:var(--card);border-radius:14px;padding:10px 6px;text-align:center;box-shadow:0 2px 8px #0000000d}
.stat b{display:block;font-size:1.3rem}
.stat span{font-size:.75rem;color:var(--muted)}
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:0 4px 14px #0000000f;margin-bottom:12px}
.belt{display:inline-block;width:46px;height:12px;border-radius:4px;vertical-align:middle;border:1px solid #0003;position:relative}
.belt::after{content:"";position:absolute;left:50%;top:-3px;width:8px;height:16px;margin-left:-4px;background:inherit;border:1px solid #0003;border-radius:2px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 16px;font-size:1.05rem;font-weight:700;cursor:pointer;
  background:var(--red);color:#fff;box-shadow:0 4px 0 #9b1c1c;margin:8px 0;transition:transform .05s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #9b1c1c}
.btn.alt{background:var(--navy);box-shadow:0 4px 0 #0f1e33}
.btn.green{background:var(--green);box-shadow:0 4px 0 #1c6d63}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 3px 0 #ddd;border:1px solid #e5e7eb}
.route{list-style:none;margin:0;padding:0;position:relative}
.route::before{content:"";position:absolute;left:25px;top:20px;bottom:20px;border-left:4px dotted #e3a3a3}
.stop{display:flex;align-items:center;gap:12px;padding:9px 6px;border-radius:14px;cursor:pointer;position:relative}
.stop .dot{width:42px;height:42px;flex:0 0 42px;border-radius:50%;display:grid;place-items:center;font-size:1.3rem;background:#fff;border:3px solid #e5e7eb;z-index:1}
.stop.done .dot{border-color:var(--ok);background:#ecfdf5}
.stop.next .dot{border-color:var(--red);background:#fff1f1;animation:pulse 1.6s infinite}
.stop.locked{opacity:.72;cursor:pointer}
.stop .info{flex:1;min-width:0}
.stop .info b{font-size:1rem}
.stop .info .sub{font-size:.8rem;color:var(--muted)}
.stop .tag{font-size:.75rem;padding:3px 8px;border-radius:99px;background:#f3f4f6;white-space:nowrap}
.stop.next .tag{background:var(--red);color:#fff}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #d6282855}50%{box-shadow:0 0 0 8px #d6282800}}
.weekbox h3{margin:0 0 6px;font-size:1rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.75rem;background:#eef2ff;color:#3730a3;padding:4px 9px;border-radius:99px}
/* match */
.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;background:var(--navy);color:#fff;border-radius:var(--radius);padding:12px;margin-bottom:10px}
.fighter{text-align:center}
.fighter .ava{font-size:2.3rem;display:inline-block;transition:transform .6s}
.fighter .nm{font-size:.85rem;font-weight:700}
.fighter .pips{margin-top:4px;font-size:1rem;letter-spacing:2px}
.fighter.blue .nm{color:#93c5fd}
.vs{font-weight:800;opacity:.7}
.thrown{animation:throw .8s ease}
@keyframes throw{0%{transform:rotate(0)}40%{transform:translateY(-18px) rotate(-200deg)}100%{transform:rotate(-360deg)}}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.qmeta{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--muted);margin-bottom:6px}
.badge{background:#fff1f1;color:var(--red);font-weight:700;padding:3px 9px;border-radius:99px}
.prompt{font-size:1.08rem;line-height:1.4;margin:4px 0 10px;font-weight:600}
.show{text-align:center;margin:10px 0 14px;line-height:2.35;padding-top:6px}
.show .jp{font-size:2rem;font-weight:700;line-height:2.35}
.jp{font-family:"Hiragino Sans","Noto Sans JP","Noto Sans CJK JP","Yu Gothic","Meiryo",system-ui,sans-serif}
.kanji{display:inline-block;margin-left:6px;font-size:.75em;color:var(--muted);font-weight:500}
.ro{display:block;font-size:.85rem;color:#2563eb;font-style:italic;font-weight:500;margin-top:2px}
.speak{border:0;background:#eef2ff;border-radius:99px;padding:4px 10px;font-size:.9rem;cursor:pointer;margin-left:6px;vertical-align:middle}
.choices{display:grid;gap:9px}
.choice{border:2px solid #e5e7eb;background:#fff;border-radius:14px;padding:16px 12px 12px;text-align:left;font-size:1rem;cursor:pointer;min-height:52px;color:var(--ink);line-height:1.85}
.choice .jp{font-size:1.15rem;font-weight:600;line-height:1.85}
.choice:disabled{cursor:default}
.choice.right{border-color:var(--ok);background:#ecfdf5}
.choice.wrong{border-color:var(--bad);background:#fef2f2}
.feedback{margin-top:12px;padding:12px;border-radius:14px;font-size:.95rem;line-height:1.4;display:none}
.feedback.ok{display:block;background:#ecfdf5;border:1px solid #a7f3d0}
.feedback.no{display:block;background:#fef2f2;border:1px solid #fecaca}
.call{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);font-size:3rem;font-weight:900;color:var(--red);
  text-shadow:0 3px 0 #fff,0 0 18px #fff;pointer-events:none;opacity:0;transition:all .25s;z-index:50;text-align:center;white-space:nowrap}
.call small{display:block;font-size:1rem;color:var(--navy)}
.call.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.result{text-align:center}
.result .big{font-size:4rem}
.row{display:flex;gap:8px}
.row .btn{flex:1}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f1f1f1}
.toggle:last-child{border-bottom:0}
select{font-size:1rem;padding:6px;border-radius:8px}
.switch{position:relative;width:52px;height:30px;flex:0 0 52px}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#d1d5db;border-radius:99px;transition:.2s;cursor:pointer}
.switch span::before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span::before{transform:translateX(22px)}
.wordlist{width:100%;border-collapse:collapse}
.wordlist td{padding:10px 4px 8px;border-bottom:1px solid #f1f1f1;vertical-align:middle}
.wordlist .jp{font-size:1.1rem}
h2{font-size:1.1rem;margin:4px 0 10px}
.muted{color:var(--muted);font-size:.85rem}
.hidden{display:none!important}
.topline{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-bottom:12px}
.progress i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}

.btn.gold{background:var(--gold);color:#1d2433;box-shadow:0 4px 0 #c47c3a}
.btn.gold:active{box-shadow:0 1px 0 #c47c3a}
.daily-card{background:linear-gradient(180deg,#fff7ed,#fff);border:1px solid #fed7aa}
.daily-card.done{background:linear-gradient(180deg,#ecfdf5,#fff);border:1px solid #a7f3d0}
.daily-card h3{margin:0 0 6px;font-size:1.05rem}

ruby{ruby-position:over;ruby-align:center;white-space:nowrap}
rt{font-size:.5em;font-weight:600;color:#4b5563;font-style:normal;line-height:1.05;font-family:inherit}
.choice,.wordlist td{overflow-wrap:break-word}
.facts li{line-height:1.85;word-break:keep-all}
.placegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.place{border:2px solid #e5e7eb;border-radius:16px;padding:12px 8px 10px;text-align:center;background:#fff;cursor:pointer;position:relative}
.place:active{transform:translateY(1px)}
.place .ico{font-size:2rem}
.place b{display:block;margin-top:4px}
.place .sub{font-size:.75rem;color:var(--muted);min-height:2.2em}
.place.picked{border-color:var(--gold);background:#fff7ed}
.place .infoi{position:absolute;top:6px;right:6px;border:0;background:#eef2ff;border-radius:99px;width:28px;height:28px;cursor:pointer;font-size:.9rem}
.facts{margin:0;padding-left:1.15em}
.facts li{margin:0 0 8px;line-height:1.45}
.wish-banner{background:linear-gradient(180deg,#eef2ff,#fff);border:1px solid #c7d2fe;border-radius:var(--radius);padding:12px 14px;margin-bottom:12px}
.maphint{text-align:center;margin:8px 0 0}
</style>
</head>
<body>
<header>
  <h1>🥋 Judo-reisen i Japan<small id="hdrSub">Haralds japanskspill</small></h1>
  <div>
    <button class="iconbtn" id="btnWords" title="Ukens ord" aria-label="Ukens ord">📖</button>
    <button class="iconbtn" id="btnSettings" title="Innstillinger" aria-label="Innstillinger">⚙️</button>
  </div>
</header>

<main id="app"></main>
<div class="call" id="call"></div>

<script>
/* =====================================================================
   UKENS TEMA  —  legg til nye uker her (se README.md)
   ---------------------------------------------------------------------
   Nøkkel = ukenummer. Hver uke har:
     label   : visningsnavn
     topics  : korte stikkord som vises på forsiden
     vocab   : ord som spillet lager spørsmål av automatisk
               { no:'norsk betydning', jp:'kana', kanji:'(valgfritt)', ro:'romaji', tema:'...' }
     lengths : fakta for matte-oppgaver (omgjøring av lengdeenheter)
               { text:'... {v} {u} ...', v: tall, u:'km'|'m'|'dm'|'cm'|'mm' }
     questions: egne flervalgsspørsmål.  FØRSTE svaralternativ er ALLTID riktig
               (spillet stokker rekkefølgen). Et svar kan være tekst (norsk)
               eller et japansk objekt { jp:'...', ro:'...', kanji:'...' }.
               show (valgfritt) = japansk tekst som vises stort i spørsmålet.
   ===================================================================== */
const WEEK_CONTENT = {
  46: {
    label: "Uke 46",
    topics: ["Lengdeenheter på reisen", "Vær", "Fotball og judo", "Være en god venn", "Advent og vinter", "Natur", "Lesing", "Låneord"],
    vocab: [
      // Vær: temperatur, vind, nedbør, skyer
      { no:"vær", jp:"てんき", kanji:"天気", ro:"tenki", tema:"Vær" },
      { no:"sol / klarvær", jp:"はれ", kanji:"晴れ", ro:"hare", tema:"Vær" },
      { no:"overskyet", jp:"くもり", kanji:"曇り", ro:"kumori", tema:"Vær" },
      { no:"sky", jp:"くも", kanji:"雲", ro:"kumo", tema:"Vær" },
      { no:"regn", jp:"あめ", kanji:"雨", ro:"ame", tema:"Vær" },
      { no:"snø", jp:"ゆき", kanji:"雪", ro:"yuki", tema:"Vær" },
      { no:"vind", jp:"かぜ", kanji:"風", ro:"kaze", tema:"Vær" },
      { no:"varmt (vær)", jp:"あつい", kanji:"暑い", ro:"atsui", tema:"Vær" },
      { no:"kaldt (vær)", jp:"さむい", kanji:"寒い", ro:"samui", tema:"Vær" },
      { no:"lufttemperatur", jp:"きおん", kanji:"気温", ro:"kion", tema:"Vær" },
      // Sport: fotball og judo
      { no:"fotball", jp:"サッカー", ro:"sakkā", tema:"Sport" },
      { no:"ball", jp:"ボール", ro:"bōru", tema:"Sport" },
      { no:"mål (i fotball)", jp:"ゴール", ro:"gōru", tema:"Sport" },
      { no:"kamp", jp:"しあい", kanji:"試合", ro:"shiai", tema:"Sport" },
      { no:"belte", jp:"おび", kanji:"帯", ro:"obi", tema:"Sport" },
      { no:"treningssal for judo", jp:"どうじょう", kanji:"道場", ro:"dōjō", tema:"Sport" },
      { no:"trener / sensei", jp:"せんせい", kanji:"先生", ro:"sensei", tema:"Sport" },
      // Advent og musikk
      { no:"stearinlys", jp:"ろうそく", ro:"rōsoku", tema:"Advent" },
      { no:"stjerne", jp:"ほし", kanji:"星", ro:"hoshi", tema:"Advent" },
      { no:"vinter", jp:"ふゆ", kanji:"冬", ro:"fuyu", tema:"Advent" },
      { no:"sang", jp:"うた", kanji:"歌", ro:"uta", tema:"Musikk" },
      { no:"jul", jp:"クリスマス", ro:"kurisumasu", tema:"Advent" },
      // Natur
      { no:"skog", jp:"もり", kanji:"森", ro:"mori", tema:"Natur" },
      { no:"fjell", jp:"やま", kanji:"山", ro:"yama", tema:"Natur" },
      { no:"tre", jp:"き", kanji:"木", ro:"ki", tema:"Natur" },
      { no:"elv", jp:"かわ", kanji:"川", ro:"kawa", tema:"Natur" },
      // Lesing, advent og låneord
      { no:"bok", jp:"ほん", kanji:"本", ro:"hon", tema:"Lesing" },
      { no:"lese", jp:"よむ", kanji:"読む", ro:"yomu", tema:"Lesing" },
      { no:"kirke", jp:"きょうかい", kanji:"教会", ro:"kyōkai", tema:"Advent" },
      { no:"symaskin", jp:"ミシン", ro:"mishin", tema:"Låneord" },
      { no:"meter", jp:"メートル", ro:"mētoru", tema:"Matte" },
      { no:"kilometer", jp:"キロメートル", ro:"kiromētoru", tema:"Matte" }
    ],
    lengths: [
      { text:"Lyntoget (しんかんせん) fra Tokyo til Kyoto kjører ca. {v} {u}.", v:476, u:"km" },
      { text:"Fra Kyoto til Osaka er det ca. {v} {u} med tog.", v:40, u:"km" },
      { text:"Fra Osaka til Hiroshima kjører lyntoget ca. {v} {u}.", v:340, u:"km" },
      { text:"Fra Hiroshima til Fukuoka er det ca. {v} {u}.", v:280, u:"km" },
      { text:"Tokyo Skytree er {v} {u} høyt.", v:634, u:"m" },
      { text:"Fjellet Fuji (ふじさん) er {v} {u} høyt.", v:3776, u:"m" },
      { text:"En tatami-matte er ca. {v} {u} lang.", v:180, u:"cm" },
      { text:"En judomatte er ca. {v} {u} tykk.", v:4, u:"cm" },
      { text:"Judobeltet til Harald er ca. {v} {u} langt.", v:270, u:"cm" },
      { text:"Et fotballmål er {v} {u} bredt.", v:7.32, u:"m" },
      { text:"Et par spisepinner (はし) er ca. {v} {u} lange.", v:23, u:"cm" }
    ],
    questions: [
      // Vær
      { tema:"Vær", prompt:"Du ser ut av vinduet: Sola skinner og himmelen er klar. Hvilket ord passer?",
        choices:[{jp:"はれ",ro:"hare",kanji:"晴れ"},{jp:"くもり",ro:"kumori"},{jp:"ゆき",ro:"yuki"},{jp:"かぜ",ro:"kaze"}],
        explain:"はれ (晴れ) = sol / klarvær." },
      { tema:"Vær", prompt:"Du ser opp: Himmelen er helt grå av skyer. Hvilket ord passer?",
        choices:[{jp:"くもり",ro:"kumori",kanji:"曇り"},{jp:"はれ",ro:"hare"},{jp:"あつい",ro:"atsui"},{jp:"ほし",ro:"hoshi"}],
        explain:"くもり (曇り) = overskyet. くも = sky." },
      { tema:"Vær", prompt:"Hva betyr dette?", show:{jp:"かぜが つよいです。",ro:"Kaze ga tsuyoi desu."},
        choices:["Det blåser kraftig.","Det regner mye.","Det er veldig varmt.","Snøen er dyp."],
        explain:"かぜ = vind, つよい = sterk." },
      { tema:"Vær", prompt:"Hva betyr dette?", show:{jp:"あめが ふっています。",ro:"Ame ga futte imasu."},
        choices:["Det regner.","Det snør.","Sola skinner.","Det er tåke."],
        explain:"あめ = regn, ふっています = faller (nå)." },
      { tema:"Vær", prompt:"Hva betyr dette?", show:{jp:"ゆきが ふっています。",ro:"Yuki ga futte imasu."},
        choices:["Det snør.","Det regner.","Det blåser.","Det er overskyet."],
        explain:"ゆき = snø. Akkurat som i Norge om vinteren!" },
      { tema:"Vær", prompt:"Hjemme i Norge er det −3 grader. Hva sier du?",
        choices:[{jp:"さむいですね。",ro:"Samui desu ne."},{jp:"あついですね。",ro:"Atsui desu ne."},{jp:"おいしいですね。",ro:"Oishii desu ne."},{jp:"はやいですね。",ro:"Hayai desu ne."}],
        explain:"さむい = kaldt. あつい = varmt." },
      { tema:"Vær", prompt:"Hvordan spør du «Hvordan er været i dag?»",
        choices:[{jp:"きょうの てんきは どうですか。",ro:"Kyō no tenki wa dō desu ka."},{jp:"でんきは どこですか。",ro:"Denki wa doko desu ka."},{jp:"きょうは なんようびですか。",ro:"Kyō wa nan'yōbi desu ka."},{jp:"てんきを ください。",ro:"Tenki o kudasai."}],
        explain:"てんき = vær. Pass på: でんき (denki) betyr strøm/lys!" },
      // Sport / judo
      { tema:"Judo", prompt:"Dommeren roper «はじめ!» (hajime). Hva betyr det?",
        choices:["Begynn!","Stopp!","Bukk!","Du vant!"], explain:"はじめ = begynn. まて (mate) = stopp/vent." },
      { tema:"Judo", prompt:"Dommeren roper «まて!» (mate). Hva gjør du?",
        choices:["Stopper og venter","Kaster motstanderen","Bukker og går","Tar av beltet"], explain:"まて = vent/stopp." },
      { tema:"Judo", prompt:"Hva roper dommeren når et kast er helt perfekt?",
        choices:[{jp:"いっぽん!",ro:"Ippon!"},{jp:"わざあり!",ro:"Waza-ari!"},{jp:"まて!",ro:"Mate!"},{jp:"れい!",ro:"Rei!"}],
        explain:"いっぽん (一本) = fullt poeng, kampen er vunnet. わざあり = halvt poeng." },
      { tema:"Judo", prompt:"Før randori (trening med partner) bukker du og sier:",
        choices:[{jp:"よろしく おねがいします。",ro:"Yoroshiku onegaishimasu."},{jp:"ごちそうさまでした。",ro:"Gochisōsama deshita."},{jp:"おやすみなさい。",ro:"Oyasuminasai."},{jp:"いくらですか。",ro:"Ikura desu ka."}],
        explain:"よろしく おねがいします = omtrent «la oss ha en god trening sammen». Respekt!" },
      { tema:"Sport", prompt:"Du spiller fotball med vennene dine. Hva heter fotball på japansk?",
        choices:[{jp:"サッカー",ro:"sakkā"},{jp:"じゅうどう",ro:"jūdō"},{jp:"やきゅう",ro:"yakyū"},{jp:"すいえい",ro:"suiei"}],
        explain:"サッカー (sakkā) = fotball (fra engelsk «soccer»). やきゅう = baseball, すいえい = svømming." },
      // Være en god venn
      { tema:"God venn", prompt:"En ny gutt står alene i parken mens dere spiller. Hva kan du si for å inkludere ham?",
        choices:[{jp:"いっしょに あそぼう!",ro:"Issho ni asobō!"},{jp:"さようなら。",ro:"Sayōnara."},{jp:"いただきます。",ro:"Itadakimasu."},{jp:"まて!",ro:"Mate!"}],
        explain:"いっしょに あそぼう! = La oss leke sammen! Det er å inkludere andre." },
      { tema:"God venn", prompt:"Vennen din gjorde et kjempefint judokast. Hva sier du?",
        choices:[{jp:"すごいね!",ro:"Sugoi ne!"},{jp:"さむいね!",ro:"Samui ne!"},{jp:"ねむいね!",ro:"Nemui ne!"},{jp:"たかいね!",ro:"Takai ne!"}],
        explain:"すごい = fantastisk/kult. Hyggelige ord gjør andre glade." },
      { tema:"God venn", prompt:"Du dunket borti noen ved et uhell. Hva sier du?",
        choices:[{jp:"ごめんなさい。",ro:"Gomen nasai."},{jp:"どうぞ。",ro:"Dōzo."},{jp:"いっぽん!",ro:"Ippon!"},{jp:"おはよう。",ro:"Ohayō."}],
        explain:"ごめんなさい = unnskyld (beklager). すみません brukes også." },
      { tema:"God venn", prompt:"Noen sier «ありがとう» til deg. Hva svarer du?",

const DAILY_POOL = [
  {id:"judo-01", tema:"Judo", prompt:"Du kommer inn i dojoen. Hva gjør du først?", choices:["Tar av skoene og bukker","Roper «はじめ!» og løper inn","Setter på deg beltet i gangen","Kaster veska på matta"], explain:"I dojoen tar man av skoene og bukker (れい) både inn og ut. Det viser respekt for stedet og de andre."},
  {id:"judo-02", tema:"Judo", prompt:"Hva heter judodrakten på japansk?", choices:[{jp:"じゅうどうぎ",ro:"jūdōgi",kanji:"柔道衣"},{jp:"ゆかた",ro:"yukata"},{jp:"じんじゃ",ro:"jinja"},{jp:"ふとん",ro:"futon"}], explain:"じゅうどうぎ (柔道衣) = judodrakt. Den kalles også どうぎ (dōgi). ゆかた er et sommerplagg, ikke til judo."},
  {id:"judo-03", tema:"Judo", prompt:"Hva betyr うけみ (受け身)?", choices:["Fallteknikk – å lande trygt","Et kast over hofta","Et fast grep i jakka","En pause midt i kampen"], explain:"うけみ = fallteknikk. God ukemi er det første du lærer, så du ikke slår deg når du blir kastet."},
  {id:"judo-04", tema:"Judo", prompt:"Kastet おおごし (大腰) er et …", choices:["hoftekast","fotkast","hold på ryggen","beltegrep"], explain:"おお = stor, こし/ごし = hofte. おおごし (ōgoshi) er et klassisk hoftekast."},
  {id:"judo-05", tema:"Judo", prompt:"I judo kalles den som blir kastet for:", choices:[{jp:"うけ",ro:"uke",kanji:"受け"},{jp:"とり",ro:"tori"},{jp:"しんぱん",ro:"shinpan"},{jp:"かんちょう",ro:"kanchō"}], explain:"うけ = den som tar imot kastet. とり = den som utfører teknikken."},
  {id:"judo-06", tema:"Judo", prompt:"Hva heter den som utfører teknikken?", choices:[{jp:"とり",ro:"tori",kanji:"取り"},{jp:"うけ",ro:"uke"},{jp:"きゅう",ro:"kyū"},{jp:"たたみ",ro:"tatami"}], explain:"とり utfører teknikken, うけ tar imot. Begge øver sammen – uten uke, ingen とり!"},
  {id:"judo-07", tema:"Judo", prompt:"Dommeren roper «それまで!» (sore made). Hva betyr det?", choices:["Tiden er ute / kampen er over","Fortsett!","Hold fast!","Bytt side!"], explain:"それまで = «det er nok / så langt». Kampen eller øvelsen er ferdig."},
  {id:"judo-08", tema:"Judo", prompt:"Dommeren roper «よし!» (yoshi) mens du holder. Hva betyr det?", choices:["Fortsett!","Stopp!","Ugyldig kast","Gå tilbake til midten"], explain:"よし = fortsett. Brukes når holdingen fortsatt gjelder."},
  {id:"judo-09", tema:"Judo", prompt:"Hva betyr おさえこみ (抑え込み)?", choices:["Holding / kontroll på bakken","Et stort fotkast","Å bukke tre ganger","Å bytte til blå drakt"], explain:"おさえこみ = holding. Hvis du holder motstanderen lenge nok, kan du vinne på ippon."},
  {id:"judo-10", tema:"Judo", prompt:"Hva roper dommeren når holdingen blir brutt?", choices:[{jp:"とけた!",ro:"Toketa!"},{jp:"はじめ!",ro:"Hajime!"},{jp:"れい!",ro:"Rei!"},{jp:"いっぽん!",ro:"Ippon!"}], explain:"とけた = holdingen er brutt. Dere fortsetter å kjempe."},
  {id:"judo-11", tema:"Judo", prompt:"Trening med partner (ikke konkurranse) heter:", choices:[{jp:"らんどり",ro:"randori",kanji:"乱取り"},{jp:"しあい",ro:"shiai"},{jp:"かた",ro:"kata"},{jp:"れい",ro:"rei"}], explain:"らんどり = fri trening med partner. しあい = konkurransekamp, かた = faste former."},
  {id:"judo-12", tema:"Judo", prompt:"Faste teknikker i en avtalt rekkefølge heter:", choices:[{jp:"かた",ro:"kata",kanji:"形"},{jp:"らんどり",ro:"randori"},{jp:"おさえこみ",ro:"osaekomi"},{jp:"きもの",ro:"kimono"}], explain:"かた (形) = form. Dere øver teknikker i en bestemt rekkefølge, ofte med れい imellom."},
  {id:"judo-13", tema:"Judo", prompt:"Hva betyr わざ (技) i judo?", choices:["teknikk","belte","matte","dommer"], explain:"わざ = teknikk. Derfor heter halvt poeng わざあり – «det er teknikk»."},
  {id:"judo-14", tema:"Judo", prompt:"Kastet おおそとがり (大外刈り) er når du …", choices:["feier motstanderens ytterlegg bakover","holder armene i bakken","kaster over hofta","drar i beltet og løper unna"], explain:"おお = stor, そと = utside, がり = feie. おおそとがり (ōsoto-gari) er et av de første kastene mange lærer."},
  {id:"judo-15", tema:"Judo", prompt:"Hva heter grepet i jakka (krage og erme)?", choices:[{jp:"くみかた",ro:"kumikata",kanji:"組み方"},{jp:"うけみ",ro:"ukemi"},{jp:"れい",ro:"rei"},{jp:"おび",ro:"obi"}], explain:"くみかた = måten dere griper i hverandres drakt. Et godt grep er starten på mange kast."},
  {id:"judo-16", tema:"Judo", prompt:"Før og etter trening sitter judoka ofte på knærne. Hva heter den sittestillingen?", choices:[{jp:"せいざ",ro:"seiza",kanji:"正座"},{jp:"たたみ",ro:"tatami"},{jp:"ざぶとん",ro:"zabuton"},{jp:"ふとん",ro:"futon"}], explain:"せいざ = formell sitting på knærne, typisk når dere bukker sammen."},
  {id:"judo-17", tema:"Judo", prompt:"Når du går inn på matta til en partner, sier du ofte:", choices:[{jp:"おねがいします。",ro:"Onegaishimasu."},{jp:"いただきます。",ro:"Itadakimasu."},{jp:"いってきます。",ro:"Ittekimasu."},{jp:"おかえり。",ro:"Okaeri."}], explain:"おねがいします = vær så snill / la oss trene sammen. いただきます sier du før mat, ikke før randori."},
  {id:"judo-18", tema:"Judo", prompt:"Etter en hard økt kan du si dette til de andre:", choices:[{jp:"おつかれさまでした。",ro:"Otsukaresama deshita."},{jp:"いただきます。",ro:"Itadakimasu."},{jp:"はじめまして。",ro:"Hajimemashite."},{jp:"いってらっしゃい。",ro:"Itterasshai."}], explain:"おつかれさまでした = takk for innsatsen / godt jobba, typisk etter trening eller arbeid."},
  {id:"judo-19", tema:"Judo", prompt:"Hva heter kampdommeren på japansk?", choices:[{jp:"しんぱん",ro:"shinpan",kanji:"審判"},{jp:"せんせい",ro:"sensei"},{jp:"せんぱい",ro:"senpai"},{jp:"かちょう",ro:"kachō"}], explain:"しんぱん = dommer. せんせい = lærer/trener, せんぱい = mer erfaren utøver."},
  {id:"judo-20", tema:"Judo", prompt:"En mer erfaren utøver i klubben kalles ofte:", choices:[{jp:"せんぱい",ro:"senpai",kanji:"先輩"},{jp:"こうはい",ro:"kōhai"},{jp:"しんぱん",ro:"shinpan"},{jp:"おきゃく",ro:"okyaku"}], explain:"せんぱい = eldre eller mer erfaren. こうはい = den som er nyere enn deg."},
  {id:"judo-21", tema:"Judo", prompt:"Hva betyr たちわざ (立ち技)?", choices:["teknikker i stående","teknikker på bakken","bare oppvarming","å knyte beltet"], explain:"たち = stående, わざ = teknikk. Teknikker på bakken heter ねわざ."},
  {id:"judo-22", tema:"Judo", prompt:"Hva betyr ねわざ (寝技)?", choices:["teknikker på bakken","teknikker i stående","å sove i dojoen","å vaske matta"], explain:"ね = liggende, わざ = teknikk. Her øver dere holding og kontroll på bakken."},
  {id:"judo-23", tema:"Judo", prompt:"I internasjonale kamper har den ene blå drakt. Hva er «blå» på japansk?", choices:[{jp:"あお",ro:"ao",kanji:"青"},{jp:"あか",ro:"aka"},{jp:"きいろ",ro:"kiiro"},{jp:"しろ",ro:"shiro"}], explain:"あお = blå. あか = rød, きいろ = gul, しろ = hvit."},
  {id:"judo-24", tema:"Judo", prompt:"Grader under svart belte kalles きゅう (級). Hva er きゅう?", choices:["elevgrader (f.eks. 5. kyū)","antall kast i kampen","alderen til utøveren","fargen på matta"], explain:"きゅう (級) = kyū, grader før svart belte. Etter det kommer だん (段)."},
  {id:"reise-01", tema:"Reise", prompt:"Du skal sjekke inn. Hva heter hotell på japansk?", choices:[{jp:"ホテル",ro:"hoteru"},{jp:"びょういん",ro:"byōin"},{jp:"こうえん",ro:"kōen"},{jp:"としょかん",ro:"toshokan"}], explain:"ホテル = hotell (katakana, fra engelsk). びょういん = sykehus, こうえん = park, としょかん = bibliotek."},
  {id:"reise-02", tema:"Reise", prompt:"Du har en reservasjon. Hva sier du i resepsjonen?", choices:[{jp:"よやくが あります。",ro:"Yoyaku ga arimasu."},{jp:"きっぷを たべます。",ro:"Kippu o tabemasu."},{jp:"まって、はじめ!",ro:"Matte, hajime!"},{jp:"ゆきが すきです。",ro:"Yuki ga suki desu."}], explain:"よやくが あります = jeg har en reservasjon. よやく (予約) = reservasjon."},
  {id:"reise-03", tema:"Reise", prompt:"Hva betyr くうこう (空港)?", choices:["flyplass","havn","togstasjon","bussholdeplass"], explain:"くうこう = flyplass. くう = luft/sky, こう = havn – «luft-havn»."},
  {id:"reise-04", tema:"Reise", prompt:"Hvordan spør du «Hvor er flyplassen?»", choices:[{jp:"くうこうは どこですか。",ro:"Kūkō wa doko desu ka."},{jp:"くうこうを ください。",ro:"Kūkō o kudasai."},{jp:"くうこうは おいしいです。",ro:"Kūkō wa oishii desu."},{jp:"くうこう、がんばって。",ro:"Kūkō, ganbatte."}], explain:"〜は どこですか = hvor er …? Samme mønster som えきは どこですか。"},
  {id:"reise-05", tema:"Reise", prompt:"Hva heter (trille)koffert ofte på japansk?", choices:[{jp:"スーツケース",ro:"sūtsukēsu"},{jp:"パスポート",ro:"pasupōto"},{jp:"エアコン",ro:"eakon"},{jp:"エレベーター",ro:"erebētā"}], explain:"スーツケース kommer fra engelsk «suitcase». パスポート = pass."},
  {id:"reise-06", tema:"Reise", prompt:"Passet ditt heter:", choices:[{jp:"パスポート",ro:"pasupōto"},{jp:"カレンダー",ro:"karendā"},{jp:"サンドイッチ",ro:"sandoitchi"},{jp:"フォーク",ro:"fōku"}], explain:"パスポート = pass. Husk det i veska før du går til くうこう!"},
  {id:"reise-07", tema:"Reise", prompt:"Du skal ta taxi. Hva heter taxi på japansk?", choices:[{jp:"タクシー",ro:"takushī"},{jp:"バイク",ro:"baiku"},{jp:"ボート",ro:"bōto"},{jp:"ケーブル",ro:"kēburu"}], explain:"タクシー = taxi (katakana). バイク = motorsykkel."},
  {id:"reise-08", tema:"Reise", prompt:"Du vil si «Til stasjonen, vær så snill» til sjåføren:", choices:[{jp:"えきまで おねがいします。",ro:"Eki made onegaishimasu."},{jp:"えきを たべます。",ro:"Eki o tabemasu."},{jp:"えきは さむいです。",ro:"Eki wa samui desu."},{jp:"えき、さようなら。",ro:"Eki, sayōnara."}], explain:"〜まで = til (et sted). おねがいします = vær så snill. Nyttig i taxi!"},
  {id:"reise-09", tema:"Reise", prompt:"«Rett frem» når noen viser vei, heter:", choices:[{jp:"まっすぐ",ro:"massugu"},{jp:"みぎ",ro:"migi"},{jp:"ひだり",ro:"hidari"},{jp:"うしろ",ro:"ushiro"}], explain:"まっすぐ = rett frem. みぎ = høyre, ひだり = venstre, うしろ = bak."},
  {id:"reise-10", tema:"Reise", prompt:"Hva betyr うしろ (後ろ)?", choices:["bak","foran","ved siden av","inni"], explain:"うしろ = bak. Det motsatte er まえ (foran)."},
  {id:"reise-11", tema:"Reise", prompt:"Hva betyr まえ (前)?", choices:["foran","bak","over","under"], explain:"まえ = foran / før. うしろ = bak."},

  {id:"reise-14", tema:"Reise", prompt:"Hvordan spør du «Er det langt?»", choices:[{jp:"とおいですか。",ro:"Tōi desu ka."},{jp:"ちかいですか。",ro:"Chikai desu ka."},{jp:"たかいですか。",ro:"Takai desu ka."},{jp:"ひろいですか。",ro:"Hiroi desu ka."}], explain:"とおい = langt unna. ちかい = nær. たかい = dyrt/høyt, ひろい = romslig."},
  {id:"reise-15", tema:"Reise", prompt:"Hva betyr ちかい (近い)?", choices:["nær","langt unna","dyrt","raskt"], explain:"ちかい = nær. Motsetning: とおい = langt unna."},
  {id:"reise-16", tema:"Reise", prompt:"Hvordan spør du hvilket spor toget går fra?", choices:[{jp:"なんばんせんですか。",ro:"Nanbansen desu ka."},{jp:"なんじですか。",ro:"Nanji desu ka."},{jp:"なんにんですか。",ro:"Nannin desu ka."},{jp:"なんさいですか。",ro:"Nansai desu ka."}], explain:"ばんせん (番線) = spor/plattformnummer. なんばんせんですか = hvilket spor?"},
  {id:"reise-17", tema:"Reise", prompt:"Suvenir / gave fra turen heter:", choices:[{jp:"みやげ",ro:"miyage",kanji:"土産"},{jp:"てがみ",ro:"tegami"},{jp:"しお",ro:"shio"},{jp:"かさ",ro:"kasa"}], explain:"みやげ (おみやげ) = suvenir / gave man tar med hjem. En klassiker etter en tur!"},
  {id:"reise-18", tema:"Reise", prompt:"Hvordan spør du «Hvor lang tid tar det?»", choices:[{jp:"どのぐらい かかりますか。",ro:"Dono gurai kakarimasu ka."},{jp:"いくら はなしますか。",ro:"Ikura hanashimasu ka."},{jp:"だれが いますか。",ro:"Dare ga imasu ka."},{jp:"なんがつですか。",ro:"Nangatsu desu ka."}], explain:"どのぐらい = hvor mye / hvor lenge, かかります = det tar (tid eller penger)."},
  {id:"reise-19", tema:"Reise", prompt:"Hvordan spør du «Er dette toget til Osaka?»", choices:[{jp:"これは おおさか いきの でんしゃですか。",ro:"Kore wa Ōsaka iki no densha desu ka."},{jp:"これは おおさかを たべますか。",ro:"Kore wa Ōsaka o tabemasu ka."},{jp:"おおさかは ねこですか。",ro:"Ōsaka wa neko desu ka."},{jp:"でんしゃは あめですか。",ro:"Densha wa ame desu ka."}], explain:"〜いき (行き) = bound for / toget som går til … Nyttig på stasjonen!"},
  {id:"reise-20", tema:"Reise", prompt:"Du har mistet billetten. Hva kan du si?", choices:[{jp:"きっぷを なくしました。",ro:"Kippu o nakushimashita."},{jp:"きっぷを たべました。",ro:"Kippu o tabemashita."},{jp:"きっぷは あついです。",ro:"Kippu wa atsui desu."},{jp:"きっぷ、おやすみ。",ro:"Kippu, oyasumi."}], explain:"なくしました = jeg har mistet (noe). Si det i luken, så hjelper de deg."},
  {id:"reise-21", tema:"Reise", prompt:"Hva betyr よやく (予約)?", choices:["reservasjon","avbudsreise","visum","turistkort"], explain:"よやく = reservasjon, for både hotell, restaurant og togsete."},

  {id:"reise-23", tema:"Reise", prompt:"«Er det ledig rom?» på hotellet:", choices:[{jp:"あきべやは ありますか。",ro:"Akibeya wa arimasu ka."},{jp:"あきべやを のみますか。",ro:"Akibeya o nomimasu ka."},{jp:"へやは サッカーですか。",ro:"Heya wa sakkā desu ka."},{jp:"へや、はじめ!",ro:"Heya, hajime!"}], explain:"あきべや (空き部屋) = ledig rom. ありますか = finnes det / har dere?"},

  {id:"reise-25", tema:"Reise", prompt:"Hvordan sier du «Jeg vil sjekke inn» på hotellet?", choices:[{jp:"チェックイン おねがいします。",ro:"Chekkuin onegaishimasu."},{jp:"チェックアウトを たべます。",ro:"Chekkuauto o tabemasu."},{jp:"チェックインは さむいです。",ro:"Chekkuin wa samui desu."},{jp:"チェキを ください。",ro:"Cheki o kudasai."}], explain:"チェックイン = check-in (katakana). チェックアウト = check-out når du reiser videre."},

  {id:"mat-03", tema:"Mat", prompt:"Du er tørst i kiosken. Hva ber du om?", choices:[{jp:"みずを ください。",ro:"Mizu o kudasai."},{jp:"くつを ください。",ro:"Kutsu o kudasai."},{jp:"ちずを ねます。",ro:"Chizu o nemasu."},{jp:"でんしゃを のみます。",ro:"Densha o nomimasu."}], explain:"みずを ください = vann, vær så snill. ください = gi meg / kan jeg få."},
  {id:"mat-04", tema:"Mat", prompt:"Hva betyr おちゃ (お茶)?", choices:["te","kaffe","melk","juice"], explain:"おちゃ = te. I Japan får du ofte grønn te. コーヒー = kaffe."},
  {id:"mat-05", tema:"Mat", prompt:"Kaffe skrives ofte slik:", choices:[{jp:"コーヒー",ro:"kōhī"},{jp:"コーラス",ro:"kōrasu"},{jp:"コート",ro:"kōto"},{jp:"ゴール",ro:"gōru"}], explain:"コーヒー = kaffe (fra engelsk/nederlandsk). Lange ō-lyder skrives コー."},
  {id:"mat-06", tema:"Mat", prompt:"Hvordan ber du om menyen?", choices:[{jp:"メニューを ください。",ro:"Menyū o kudasai."},{jp:"メニューを きります。",ro:"Menyū o kirimasu."},{jp:"メニューは さむいです。",ro:"Menyū wa samui desu."},{jp:"メニュー、がんばって。",ro:"Menyū, ganbatte."}], explain:"メニューを ください = menyen, vær så snill. きります = å kutte – ikke kutt menyen!"},
  {id:"mat-07", tema:"Mat", prompt:"Du er ferdig og vil betale. Hva sier du?", choices:[{jp:"おかいけい おねがいします。",ro:"Okaikei onegaishimasu."},{jp:"おかいけいを たべます。",ro:"Okaikei o tabemasu."},{jp:"おんせんは どこですか。",ro:"Onsen wa doko desu ka."},{jp:"れんしゅう しましょう。",ro:"Renshū shimashō."}], explain:"おかいけい (お会計) = regningen. おかいけい おねがいします = kan jeg få betale, vær så snill."},
  {id:"mat-08", tema:"Mat", prompt:"Hva betyr からい?", choices:["sterk / krydret","søt","sur","bitter"], explain:"からい = sterk, krydret. あまい = søt, すっぱい = sur, にがい = bitter."},
  {id:"mat-09", tema:"Mat", prompt:"Hva betyr あまい?", choices:["søt","salt","varm","kald"], explain:"あまい = søt. Kakene og isen i Japan kan være あまい!"},
  {id:"mat-10", tema:"Mat", prompt:"I kiosken vil du ta med maten ut. «Å ta med» heter ofte:", choices:[{jp:"もちかえり",ro:"mochikaeri"},{jp:"ひるね",ro:"hirune"},{jp:"かいもの",ro:"kaimono"},{jp:"かけはし",ro:"kakehashi"}], explain:"もちかえり (持ち帰り) = take-away / å ta med hjem. Du kan også se テイクアウト."},
  {id:"mat-11", tema:"Mat", prompt:"Hva sier du når du er sulten?", choices:[{jp:"おなかが すきました。",ro:"Onaka ga sukimashita."},{jp:"のどが かわきました。",ro:"Nodo ga kawakimashita."},{jp:"あたまが いたいです。",ro:"Atama ga itai desu."},{jp:"ねむくないです。",ro:"Nemukunai desu."}], explain:"おなかが すきました = jeg er sulten (magen har blitt tom). のどが かわきました = jeg er tørst."},
  {id:"mat-12", tema:"Mat", prompt:"Hva sier du når du er tørst?", choices:[{jp:"のどが かわきました。",ro:"Nodo ga kawakimashita."},{jp:"おなかが すきました。",ro:"Onaka ga sukimashita."},{jp:"あしが いたいです。",ro:"Ashi ga itai desu."},{jp:"かぜを ひきました。",ro:"Kaze o hikimashita."}], explain:"のど = hals, かわきました = har blitt tørr. Altså: jeg er tørst."},
  {id:"mat-13", tema:"Mat", prompt:"Spisepinner heter:", choices:[{jp:"はし",ro:"hashi"},{jp:"フォーク",ro:"fōku"},{jp:"ナイフ",ro:"naifu"},{jp:"スプーン",ro:"supūn"}], explain:"はし = spisepinner. フォーク、ナイフ、スプーン er katakana-lånord."},
  {id:"mat-14", tema:"Mat", prompt:"Soyasaus heter:", choices:[{jp:"しょうゆ",ro:"shōyu"},{jp:"しお",ro:"shio"},{jp:"さとう",ro:"satō"},{jp:"こしょう",ro:"koshō"}], explain:"しょうゆ = soyasaus. しお = salt, さとう = sukker, こしょう = pepper."},
  {id:"mat-15", tema:"Mat", prompt:"Misosuppe heter:", choices:[{jp:"みそしる",ro:"misoshiru"},{jp:"おすし",ro:"osushi"},{jp:"やきにく",ro:"yakiniku"},{jp:"おにぎり",ro:"onigiri"}], explain:"みそしる = misosuppe, ofte til frokost eller sammen med ごはん."},
  {id:"mat-16", tema:"Mat", prompt:"En matboks til tur og lunsj heter:", choices:[{jp:"べんとう",ro:"bentō"},{jp:"ふくろ",ro:"fukuro"},{jp:"はこ",ro:"hako"},{jp:"さら",ro:"sara"}], explain:"べんとう (弁当) = matboks. Du ser dem på stasjoner, i kiosker og i butikker."},
  {id:"mat-17", tema:"Mat", prompt:"Hva er うどん?", choices:["tykke hvete-nudler","en type is","grillet ål","en søt bønnekake"], explain:"うどん = tykke, myke hvete-nudler, ofte i suppe. Tynnere nudler kan være そば eller そうめん."},
  {id:"mat-18", tema:"Mat", prompt:"Hva er てんぷら (天ぷら)?", choices:["frityrstekt grønnsaker eller sjømat","en fiskesuppe","rå fisk på ris","en dessert med røde bønner"], explain:"てんぷら = mat dyppet i røre og frityrstekt – reker, grønnsaker og mer."},
  {id:"mat-19", tema:"Mat", prompt:"Karri med ris, en klassiker i Japan, heter:", choices:[{jp:"カレーライス",ro:"karē raisu"},{jp:"チーズケーキ",ro:"chīzukēki"},{jp:"フライドポテト",ro:"furaido poteto"},{jp:"ホットドッグ",ro:"hottodoggu"}], explain:"カレーライス = karri med ris. Milde, tykke sauser – en favoritt for mange barn i Japan."},
  {id:"mat-20", tema:"Mat", prompt:"Hva er ぎょうざ (餃子)?", choices:["stekte dumplings med fyll","en type grønn te","en fiskesuppe","en søt pannekake"], explain:"ぎょうざ = japanske dumplings, ofte stekt på den ene siden. Godt med しょうゆ!"},
  {id:"mat-21", tema:"Mat", prompt:"Suppa er veldig varm. Hvilket ord brukes om varm mat og drikke?", choices:[{jp:"あつい",ro:"atsui"},{jp:"つめたい",ro:"tsumetai"},{jp:"おもい",ro:"omoi"},{jp:"かるい",ro:"karui"}], explain:"あつい (熱い) = varm å ta på, om mat og drikke. つめたい = kald å ta på. (あつい 暑い brukes om været.)"},
  {id:"mat-22", tema:"Mat", prompt:"Hva betyr つめたい?", choices:["kald å ta på","varm å ta på","søt","stor"], explain:"つめたい = kald (om vann, is, hender …). さむい brukes mer om været rundt deg."},
  {id:"mat-23", tema:"Mat", prompt:"Du peker på noe i disken og vil ha det. Hva sier du?", choices:[{jp:"これを ください。",ro:"Kore o kudasai."},{jp:"だれを ください。",ro:"Dare o kudasai."},{jp:"いつを ください。",ro:"Itsu o kudasai."},{jp:"なぜを ください。",ro:"Naze o kudasai."}], explain:"これを ください = denne, vær så snill. これ = denne (nær deg)."},
  {id:"mat-24", tema:"Mat", prompt:"Hva betyr ジュース?", choices:["juice","ost","brød","smør"], explain:"ジュース = juice. Et typisk katakana-lånord."},
  {id:"mat-25", tema:"Mat", prompt:"I konbini ser du サンドイッチ. Hva er det?", choices:["en sandwich","en suppe","en kake","en te"], explain:"サンドイッチ = sandwich. Ofte kuttet i trekanter – typisk japansk kioskmat."},
  {id:"tid-01", tema:"Tall og tid", prompt:"Hvordan spør du «Hva er klokka?»", choices:[{jp:"なんじですか。",ro:"Nanji desu ka."},{jp:"いくらですか。",ro:"Ikura desu ka."},{jp:"なんさいですか。",ro:"Nansai desu ka."},{jp:"なんにんですか。",ro:"Nannin desu ka."}], explain:"なんじですか = hva er klokka? いくら = pris, なんさい = alder, なんにん = hvor mange personer."},
  {id:"tid-02", tema:"Tall og tid", prompt:"Hva betyr さんじ?", choices:["klokka tre","tre personer","tre yen","mars"], explain:"さん = tre, じ = time. さんじ = klokka tre. Mars er さんがつ."},
  {id:"tid-03", tema:"Tall og tid", prompt:"Hva betyr くじ?", choices:["klokka ni","klokka seks","klokka fem","klokka to"], explain:"く (eller きゅう) = ni, じ = time. くじ = klokka ni. Seks er ろくじ."},
  {id:"tid-04", tema:"Tall og tid", prompt:"Hva er さんじはん?", choices:["klokka halv fire (15:30)","klokka tre presis","klokka halv tre","klokka fire"], explain:"はん = halv (30 minutter). さんじはん = 3:30, som vi kaller halv fire."},
  {id:"tid-05", tema:"Tall og tid", prompt:"Hva betyr ごぜん?", choices:["formiddag / før kl. 12","ettermiddag","kveld","natt"], explain:"ごぜん (午前) = formiddag, AM. ごご (午後) = ettermiddag, PM."},
  {id:"tid-06", tema:"Tall og tid", prompt:"Hva betyr ごご?", choices:["ettermiddag / etter kl. 12","formiddag","midnatt","helg"], explain:"ごご (午後) = ettermiddag, PM. ごご にじ = kl. 14."},
  {id:"tid-07", tema:"Tall og tid", prompt:"«I morgen» heter:", choices:[{jp:"あした",ro:"ashita"},{jp:"きのう",ro:"kinō"},{jp:"きょう",ro:"kyō"},{jp:"いま",ro:"ima"}], explain:"あした = i morgen. きょう = i dag, きのう = i går, いま = nå."},
  {id:"tid-08", tema:"Tall og tid", prompt:"«I går» heter:", choices:[{jp:"きのう",ro:"kinō"},{jp:"あした",ro:"ashita"},{jp:"あさって",ro:"asatte"},{jp:"おととい",ro:"ototoi"}], explain:"きのう = i går. あさって = i overmorgen, おととい = i forgårs."},
  {id:"tid-09", tema:"Tall og tid", prompt:"«I dag» heter:", choices:[{jp:"きょう",ro:"kyō"},{jp:"あした",ro:"ashita"},{jp:"まいにち",ro:"mainichi"},{jp:"こんしゅう",ro:"konshū"}], explain:"きょう = i dag. まいにち = hver dag, こんしゅう = denne uka."},
  {id:"tid-10", tema:"Tall og tid", prompt:"Mandag heter:", choices:[{jp:"げつようび",ro:"getsuyōbi"},{jp:"かようび",ro:"kayōbi"},{jp:"すいようび",ro:"suiyōbi"},{jp:"もくようび",ro:"mokuyōbi"}], explain:"げつようび = mandag (måne-dag). かようび = tirsdag, すいようび = onsdag, もくようび = torsdag."},
  {id:"tid-11", tema:"Tall og tid", prompt:"Fredag heter:", choices:[{jp:"きんようび",ro:"kin'yōbi"},{jp:"どようび",ro:"doyōbi"},{jp:"にちようび",ro:"nichiyōbi"},{jp:"げつようび",ro:"getsuyōbi"}], explain:"きんようび = fredag (gull-dag). どようび = lørdag, にちようび = søndag."},
  {id:"tid-12", tema:"Tall og tid", prompt:"Hva betyr いま?", choices:["nå","senere","alltid","aldri"], explain:"いま = nå. いま なんじですか = hva er klokka nå?"},
  {id:"tid-13", tema:"Tall og tid", prompt:"Tallet 10 heter:", choices:[{jp:"じゅう",ro:"jū"},{jp:"いち",ro:"ichi"},{jp:"さん",ro:"san"},{jp:"ひゃく",ro:"hyaku"}], explain:"じゅう = ti. いち = én, さん = tre, ひゃく = hundre."},
  {id:"tid-14", tema:"Tall og tid", prompt:"Tallet 100 heter:", choices:[{jp:"ひゃく",ro:"hyaku"},{jp:"せん",ro:"sen"},{jp:"まん",ro:"man"},{jp:"じゅう",ro:"jū"}], explain:"ひゃく = 100. せん = 1 000, まん = 10 000."},
  {id:"tid-15", tema:"Tall og tid", prompt:"Tallet 1 000 heter:", choices:[{jp:"せん",ro:"sen"},{jp:"ひゃく",ro:"hyaku"},{jp:"まん",ro:"man"},{jp:"おく",ro:"oku"}], explain:"せん = 1 000. まん = 10 000, おく = 100 millioner."},
  {id:"tid-16", tema:"Tall og tid", prompt:"Tallet 10 000 heter:", choices:[{jp:"まん",ro:"man"},{jp:"せん",ro:"sen"},{jp:"ひゃく",ro:"hyaku"},{jp:"ゼロ",ro:"zero"}], explain:"まん (万) = 10 000. I Japan telles store tall i まん, ikke i tusener."},
  {id:"tid-17", tema:"Tall og tid", prompt:"Hvordan sier du «klokka er sju»?", choices:[{jp:"しちじです。",ro:"Shichiji desu."},{jp:"しちにんです。",ro:"Shichinin desu."},{jp:"しちえんです。",ro:"Shichien desu."},{jp:"ななこです。",ro:"Nanako desu."}], explain:"しちじ (eller ななじ) = klokka sju. しちにん = sju personer, しちえん = sju yen."},
  {id:"tid-18", tema:"Tall og tid", prompt:"Toget går kl. 14. Hvordan sies 14:00 ofte?", choices:[{jp:"ごご にじ",ro:"gogo niji"},{jp:"ごぜん にじ",ro:"gozen niji"},{jp:"ごご よじ",ro:"gogo yoji"},{jp:"ごぜん よじ",ro:"gozen yoji"}], explain:"ごご にじ = kl. 14 (2 om ettermiddagen). ごぜん にじ = kl. 08. よじ = kl. 4."},
  {id:"tid-19", tema:"Tall og tid", prompt:"Hva betyr はん når vi snakker om klokka, f.eks. くじはん?", choices:["tretti minutter over (9:30)","kvart over","kvart på","nøyaktig på slaget"], explain:"はん = halv time. くじはん = 9:30."},
  {id:"tid-20", tema:"Tall og tid", prompt:"Søndag heter:", choices:[{jp:"にちようび",ro:"nichiyōbi"},{jp:"どようび",ro:"doyōbi"},{jp:"きんようび",ro:"kin'yōbi"},{jp:"すいようび",ro:"suiyōbi"}], explain:"にちようび = søndag (sol-dag). どようび = lørdag."},
  {id:"penger-01", tema:"Penger", prompt:"Yen, den japanske valutaen, heter:", choices:[{jp:"えん",ro:"en"},{jp:"ドル",ro:"doru"},{jp:"ユーロ",ro:"yūro"},{jp:"クローネ",ro:"kurōne"}], explain:"えん (円) = yen. Symbolet er ¥ eller 円."},
  {id:"penger-02", tema:"Penger", prompt:"Hvordan sier du 100 yen?", choices:[{jp:"ひゃくえん",ro:"hyaku en"},{jp:"せんえん",ro:"sen en"},{jp:"じゅうえん",ro:"jū en"},{jp:"まんえん",ro:"man en"}], explain:"ひゃくえん = 100 yen. せんえん = 1 000 yen, じゅうえん = 10 yen."},
  {id:"penger-03", tema:"Penger", prompt:"En flaske te koster ¥150. Hvordan leser du prisen?", choices:[{jp:"ひゃくごじゅうえん",ro:"hyaku gojū en"},{jp:"じゅうごえん",ro:"jūgo en"},{jp:"せんごじゅうえん",ro:"sen gojū en"},{jp:"ごひゃくえん",ro:"gohyaku en"}], explain:"ひゃく = 100, ごじゅう = 50, えん = yen. Til sammen ひゃくごじゅうえん."},
  {id:"penger-04", tema:"Penger", prompt:"Hva betyr やすい?", choices:["billig","dyrt","raskt","sakte"], explain:"やすい = billig. Motsetning: たかい = dyrt (eller høyt)."},
  {id:"penger-05", tema:"Penger", prompt:"Hva betyr たかい når du snakker om pris?", choices:["dyrt","billig","søtt","sent"], explain:"たかい = dyrt, eller høyt (f.eks. et fjell). Av sammenhengen merker du hva som menes."},
  {id:"penger-06", tema:"Penger", prompt:"Hvordan sier du 1 000 yen?", choices:[{jp:"せんえん",ro:"sen en"},{jp:"ひゃくえん",ro:"hyaku en"},{jp:"いちまんえん",ro:"ichiman en"},{jp:"じゅうえん",ro:"jū en"}], explain:"せんえん = 1 000 yen. いちまんえん = 10 000 yen."},
  {id:"kana-01", tema:"Kana", prompt:"Les ordet! Hvordan uttales det?", show:{jp:"ホテル"}, hideRo:true, choices:["hoteru","hotaru","hiteru","hotoro"], explain:"ホテル = hoteru"},
  {id:"kana-02", tema:"Kana", prompt:"Les ordet! Hvordan uttales det?", show:{jp:"バス"}, hideRo:true, choices:["basu","pasu","batu","bisu"], explain:"バス = basu"},
  {id:"kana-03", tema:"Kana", prompt:"Les ordet! Hvordan uttales det?", show:{jp:"タクシー"}, hideRo:true, choices:["takushī","takushai","tekushi","tagushī"], explain:"タクシー = takushī"},
  {id:"kana-04", tema:"Kana", prompt:"Les ordet! Hvordan uttales det?", show:{jp:"コンビニ"}, hideRo:true, choices:["konbini","konbani","konbina","kanbini"], explain:"コンビニ = konbini"},
  {id:"kana-05", tema:"Kana", prompt:"Les ordet! Hvordan uttales det?", show:{jp:"おにぎり"}, hideRo:true, choices:["onigiri","onigara","unigiri","onikiri"], explain:"おにぎり = onigiri"},
  {id:"kana-06", tema:"Kana", prompt:"Les ordet! Hvordan uttales det?", show:{jp:"ジュース"}, hideRo:true, choices:["jūsu","jūshi","jōsu","chūsu"], explain:"ジュース = jūsu"},
  {id:"kana-07", tema:"Kana", prompt:"Les ordet! Hvordan uttales det?", show:{jp:"パン"}, hideRo:true, choices:["pan","pon","ban","pen"], explain:"パン = pan"},
  {id:"kana-08", tema:"Kana", prompt:"Les ordet! Hvordan uttales det?", show:{jp:"うどん"}, hideRo:true, choices:["udon","uten","odon","udan"], explain:"うどん = udon"},
  {id:"kana-09", tema:"Kana", prompt:"Les ordet! Hvordan uttales det?", show:{jp:"パスポート"}, hideRo:true, choices:["pasupōto","pazupōto","pasupāku","basupōto"], explain:"パスポート = pasupōto"},
  {id:"kana-10", tema:"Kana", prompt:"Les ordet! Hvordan uttales det?", show:{jp:"トイレ"}, hideRo:true, choices:["toire","toiru","tairu","tere"], explain:"トイレ = toire"},
  {id:"kana-11", tema:"Kana", prompt:"Les ordet! Hvordan uttales det?", show:{jp:"チョコレート"}, hideRo:true, choices:["chokorēto","chokorēta","chikorēto","chokorito"], explain:"チョコレート = chokorēto"},
  {id:"kana-12", tema:"Kana", prompt:"Les ordet! Hvordan uttales det?", show:{jp:"バナナ"}, hideRo:true, choices:["banana","banena","panana","banane"], explain:"バナナ = banana"},
  {id:"kana-13", tema:"Kana", prompt:"Les ordet! Hvordan uttales det?", show:{jp:"チーズ"}, hideRo:true, choices:["chīzu","chīsu","chēzu","shīzu"], explain:"チーズ = chīzu"},
  {id:"kana-14", tema:"Kana", prompt:"Les ordet! Hvordan uttales det?", show:{jp:"ピザ"}, hideRo:true, choices:["piza","pisa","piji","biza"], explain:"ピザ = piza"},
  {id:"kana-15", tema:"Kana", prompt:"Les ordet! Hvordan uttales det?", show:{jp:"ミルク"}, hideRo:true, choices:["miruku","meruku","miruko","miruka"], explain:"ミルク = miruku"},
  {id:"kana-16", tema:"Kana", prompt:"Les ordet! Hvordan uttales det?", show:{jp:"あした"}, hideRo:true, choices:["ashita","asata","ashito","ashite"], explain:"あした = ashita"},
  {id:"kana-17", tema:"Kana", prompt:"Les ordet! Hvordan uttales det?", show:{jp:"きょう"}, hideRo:true, choices:["kyō","kiyo","kyū","kayo"], explain:"きょう = kyō"},
  {id:"kana-18", tema:"Kana", prompt:"Les ordet! Hvordan uttales det?", show:{jp:"みず"}, hideRo:true, choices:["mizu","misu","mizo","nizu"], explain:"みず = mizu"},
  {id:"kana-19", tema:"Kana", prompt:"Les ordet! Hvordan uttales det?", show:{jp:"でんしゃ"}, hideRo:true, choices:["densha","tensha","denshi","desha"], explain:"でんしゃ = densha"},
  {id:"kana-20", tema:"Kana", prompt:"Les ordet! Hvordan uttales det?", show:{jp:"ありがとう"}, hideRo:true, choices:["arigatō","origatō","arikatō","arigata"], explain:"ありがとう = arigatō"},
  {id:"kana-21", tema:"Kana", prompt:"Les ordet! Hvordan uttales det?", show:{jp:"スポーツ"}, hideRo:true, choices:["supōtsu","subōtsu","supūchi","sipōtsu"], explain:"スポーツ = supōtsu"},
  {id:"kana-22", tema:"Kana", prompt:"Les ordet! Hvordan uttales det?", show:{jp:"エレベーター"}, hideRo:true, choices:["erebētā","erevitā","erebētō","erebēto"], explain:"エレベーター = erebētā"},
  {id:"kana-23", tema:"Kana", prompt:"Les ordet! Hvordan uttales det?", show:{jp:"サンドイッチ"}, hideRo:true, choices:["sandoitchi","sandoichi","sandotchi","sandoisshi"], explain:"サンドイッチ = sandoitchi"},
  {id:"kana-24", tema:"Kana", prompt:"Les ordet! Hvordan uttales det?", show:{jp:"カレー"}, hideRo:true, choices:["karē","karī","karō","karu"], explain:"カレー = karē"},
  {id:"kana-25", tema:"Kana", prompt:"Les ordet! Hvordan uttales det?", show:{jp:"アイス"}, hideRo:true, choices:["aisu","aiso","aisuū","aisa"], explain:"アイス = aisu"},
  {id:"fraser-01", tema:"Fraser", prompt:"Du møter noen for første gang. Hva sier du?", choices:[{jp:"はじめまして。",ro:"Hajimemashite."},{jp:"おかえりなさい。",ro:"Okaerinasai."},{jp:"いってきます。",ro:"Ittekimasu."},{jp:"ただいま。",ro:"Tadaima."}], explain:"はじめまして = hyggelig å treffe deg (første gang). Etterpå kan du si よろしく おねがいします。"},
  {id:"fraser-02", tema:"Fraser", prompt:"Hvordan spør du «Hva heter du?»", choices:[{jp:"おなまえは なんですか。",ro:"Onamae wa nan desu ka."},{jp:"おいくつですか。",ro:"Oikutsu desu ka."},{jp:"どこから きましたか。",ro:"Doko kara kimashita ka."},{jp:"げんきですか。",ro:"Genki desu ka."}], explain:"おなまえ = navn (høflig). おなまえは なんですか = hva heter du?"},
  {id:"fraser-03", tema:"Fraser", prompt:"Hvordan spør du «Hvor gammel er du?»", choices:[{jp:"なんさいですか。",ro:"Nansai desu ka."},{jp:"なんじですか。",ro:"Nanji desu ka."},{jp:"なんにんですか。",ro:"Nannin desu ka."},{jp:"いくらですか。",ro:"Ikura desu ka."}], explain:"なんさいですか = hvor gammel er du? (til barn og unge). Til voksne er おいくつですか mykere."},
  {id:"fraser-04", tema:"Fraser", prompt:"Hvordan sier du «Jeg kommer fra Norge»?", choices:[{jp:"ノルウェーから きました。",ro:"Noruwē kara kimashita."},{jp:"ノルウェーへ いきます。",ro:"Noruwē e ikimasu."},{jp:"ノルウェーを たべます。",ro:"Noruwē o tabemasu."},{jp:"ノルウェーは あついですか。",ro:"Noruwē wa atsui desu ka."}], explain:"〜から きました = jeg kommer fra … へ いきます = jeg skal til …"},
  {id:"fraser-05", tema:"Fraser", prompt:"Du forstod ikke. Hva sier du?", choices:[{jp:"わかりません。",ro:"Wakarimasen."},{jp:"わかります。",ro:"Wakarimasu."},{jp:"わかりました。",ro:"Wakarimashita."},{jp:"わかいです。",ro:"Wakai desu."}], explain:"わかりません = jeg forstår ikke / jeg vet ikke. わかりました = jeg skjønte det. わかい = ung."},
  {id:"fraser-06", tema:"Fraser", prompt:"Du vil høre setningen én gang til:", choices:[{jp:"もういちど おねがいします。",ro:"Mō ichido onegaishimasu."},{jp:"もう いただきます。",ro:"Mō itadakimasu."},{jp:"いちど はじめまして。",ro:"Ichido hajimemashite."},{jp:"もう おやすみです。",ro:"Mō oyasumi desu."}], explain:"もういちど = én gang til. おねがいします = vær så snill. Superfrase når det går fort!"},
  {id:"fraser-07", tema:"Fraser", prompt:"«Snakk litt saktere, vær så snill»:", choices:[{jp:"ゆっくり はなして ください。",ro:"Yukkuri hanashite kudasai."},{jp:"はやく はしって ください。",ro:"Hayaku hashitte kudasai."},{jp:"おおきく たって ください。",ro:"Ōkiku tatte kudasai."},{jp:"じっと みて ください。",ro:"Jitto mite kudasai."}], explain:"ゆっくり = sakte / rolig, はなして = snakk (て-form), ください = vær så snill."},
  {id:"fraser-08", tema:"Fraser", prompt:"«Hvordan har du det?» / «Har du det bra?»", choices:[{jp:"げんきですか。",ro:"Genki desu ka."},{jp:"きれいですか。",ro:"Kirei desu ka."},{jp:"ゆうめいですか。",ro:"Yūmei desu ka."},{jp:"しずかですか。",ro:"Shizuka desu ka."}], explain:"げんきですか = har du det bra? / er du i form? Du kan svare げんきです。"},
  {id:"fraser-09", tema:"Fraser", prompt:"Når du forlater hjemmet, sier du ofte:", choices:[{jp:"いってきます。",ro:"Ittekimasu."},{jp:"ただいま。",ro:"Tadaima."},{jp:"おかえり。",ro:"Okaeri."},{jp:"いらっしゃいませ。",ro:"Irasshaimase."}], explain:"いってきます = «jeg går, så kommer jeg tilbake». Familien kan svare いってらっしゃい。"},
  {id:"fraser-10", tema:"Fraser", prompt:"Når du kommer hjem, sier du:", choices:[{jp:"ただいま。",ro:"Tadaima."},{jp:"いってきます。",ro:"Ittekimasu."},{jp:"いってらっしゃい。",ro:"Itterasshai."},{jp:"こんにちは。",ro:"Konnichiwa."}], explain:"ただいま = «jeg er hjemme». Svaret er ofte おかえり (なさい)。"},
  {id:"fraser-11", tema:"Fraser", prompt:"Noen kommer hjem. Du sier:", choices:[{jp:"おかえり。",ro:"Okaeri."},{jp:"いってきます。",ro:"Ittekimasu."},{jp:"いただきます。",ro:"Itadakimasu."},{jp:"それまで。",ro:"Sore made."}], explain:"おかえり = velkommen hjem. Den som kommer inn, har gjerne sagt ただいま。"},
  {id:"fraser-12", tema:"Fraser", prompt:"«Gratulerer!» heter:", choices:[{jp:"おめでとう。",ro:"Omedetō."},{jp:"がんばって。",ro:"Ganbatte."},{jp:"おねがい。",ro:"Onegai."},{jp:"さようなら。",ro:"Sayōnara."}], explain:"おめでとう = gratulerer! Kan forlenges til おめでとうございます (mer høflig)."},
  {id:"fraser-13", tema:"Fraser", prompt:"«Gratulerer med dagen»:", choices:[{jp:"たんじょうび おめでとう。",ro:"Tanjōbi omedetō."},{jp:"あき おめでとう。",ro:"Aki omedetō."},{jp:"しあい おめでとう。",ro:"Shiai omedetō."},{jp:"でんしゃ おめでとう。",ro:"Densha omedetō."}], explain:"たんじょうび = bursdag. たんじょうび おめでとう = gratulerer med dagen!"},
  {id:"fraser-14", tema:"Fraser", prompt:"«Vent litt, vær så snill»:", choices:[{jp:"ちょっと まって ください。",ro:"Chotto matte kudasai."},{jp:"ちょっと たべて ください。",ro:"Chotto tabete kudasai."},{jp:"ちょっと ねて ください。",ro:"Chotto nete kudasai."},{jp:"ちょっと かって ください。",ro:"Chotto katte kudasai."}], explain:"ちょっと = litt / et øyeblikk, まって = vent (て-form av まつ), ください = vær så snill."},
  {id:"fraser-15", tema:"Fraser", prompt:"Hva betyr はい?", choices:["ja","nei","kanskje","stopp"], explain:"はい = ja (og «jeg hører deg»). いいえ = nei."},
  {id:"fraser-16", tema:"Fraser", prompt:"Hva betyr いいえ?", choices:["nei","ja","takk","hei"], explain:"いいえ = nei. I Japan brukes det litt mer forsiktig enn «nei» på norsk – ofte med en forklaring etterpå."},
  {id:"fraser-17", tema:"Fraser", prompt:"Hva betyr ちょっと i en setning som «ちょっと まって»?", choices:["litt / et øyeblikk","alltid","aldri","veldig mye"], explain:"ちょっと = litt, eller «et lite øyeblikk». Veldig vanlig i hverdagen."},
  {id:"fraser-18", tema:"Fraser", prompt:"«Det går bra» / «jeg har det fint» kan være:", choices:[{jp:"だいじょうぶです。",ro:"Daijōbu desu."},{jp:"だめです。",ro:"Dame desu."},{jp:"あぶないです。",ro:"Abunai desu."},{jp:"むずかしいです。",ro:"Muzukashii desu."}], explain:"だいじょうぶです = det går bra / jeg er OK. だめ = ikke lov / dårlig, あぶない = farlig."},
  {id:"fraser-19", tema:"Fraser", prompt:"God kveld heter:", choices:[{jp:"こんばんは。",ro:"Konbanwa."},{jp:"おはよう。",ro:"Ohayō."},{jp:"さようなら。",ro:"Sayōnara."},{jp:"おやすみ。",ro:"Oyasumi."}], explain:"こんばんは = god kveld. おはよう = god morgen, おやすみ = god natt (kort form)."},
  {id:"fraser-20", tema:"Fraser", prompt:"Før du legger deg, sier du:", choices:[{jp:"おやすみなさい。",ro:"Oyasuminasai."},{jp:"おはようございます。",ro:"Ohayō gozaimasu."},{jp:"いってきます。",ro:"Ittekimasu."},{jp:"いただきます。",ro:"Itadakimasu."}], explain:"おやすみなさい = god natt (høflig). Kort og koselig: おやすみ。"},
  {id:"fraser-21", tema:"Fraser", prompt:"I en butikk blir du møtt med «いらっしゃいませ». Hva betyr det?", choices:["Velkommen inn!","Ha det!","Gratulerer!","Unnskyld!"], explain:"いらっしゃいませ = velkommen (inn i butikken). Du trenger ikke å svare, bare smile er fint."},
  {id:"fraser-22", tema:"Fraser", prompt:"Du vil gjennom en folkemengde. Hva sier du for å komme forbi?", choices:[{jp:"すみません。",ro:"Sumimasen."},{jp:"いただきます。",ro:"Itadakimasu."},{jp:"はじめ!",ro:"Hajime!"},{jp:"おかえり。",ro:"Okaeri."}], explain:"すみません brukes både som «unnskyld» og «unnskyld, kan jeg komme forbi?». Superhverdagsfrase!"},
  {id:"setn-01", tema:"Setninger", prompt:"Hvordan sier du «Dette er et kart»?", choices:[{jp:"これは ちずです。",ro:"Kore wa chizu desu."},{jp:"これは ちずを のみます。",ro:"Kore wa chizu o nomimasu."},{jp:"ちずは だれですか。",ro:"Chizu wa dare desu ka."},{jp:"ちず、がんばって。",ro:"Chizu, ganbatte."}], explain:"これ は ちず です = dette er et kart. Mønsteret これは 〜です er gull verdt."},
  {id:"setn-02", tema:"Setninger", prompt:"Hvordan spør du «Hva er dette?»", choices:[{jp:"これは なんですか。",ro:"Kore wa nan desu ka."},{jp:"これは だれですか。",ro:"Kore wa dare desu ka."},{jp:"これは いつですか。",ro:"Kore wa itsu desu ka."},{jp:"これは どこに ねますか。",ro:"Kore wa doko ni nemasu ka."}], explain:"これは なんですか = hva er dette? だれ = hvem, いつ = når."},
  {id:"setn-03", tema:"Setninger", prompt:"Hvordan sier du «Jeg liker judo»?", choices:[{jp:"わたしは じゅうどうが すきです。",ro:"Watashi wa jūdō ga suki desu."},{jp:"わたしは じゅうどうが きらいです。",ro:"Watashi wa jūdō ga kirai desu."},{jp:"わたしは じゅうどうを きります。",ro:"Watashi wa jūdō o kirimasu."},{jp:"じゅうどうは わたしを のみます。",ro:"Jūdō wa watashi o nomimasu."}], explain:"すきです = liker. Partikkelen er が: 〜が すきです. きらいです = liker ikke."},
  {id:"setn-04", tema:"Setninger", prompt:"Hvordan sier du «Jeg liker ikke kaffe»?", choices:[{jp:"コーヒーが きらいです。",ro:"Kōhī ga kirai desu."},{jp:"コーヒーが すきです。",ro:"Kōhī ga suki desu."},{jp:"コーヒーは ねこです。",ro:"Kōhī wa neko desu."},{jp:"コーヒーを はしります。",ro:"Kōhī o hashirimasu."}], explain:"きらいです = liker ikke. Samme mønster som すきです, med が."},
  {id:"setn-05", tema:"Setninger", prompt:"Hvordan sier du «Jeg skal til Tokyo»?", choices:[{jp:"とうきょうに いきます。",ro:"Tōkyō ni ikimasu."},{jp:"とうきょうを たべます。",ro:"Tōkyō o tabemasu."},{jp:"とうきょうが みずです。",ro:"Tōkyō ga mizu desu."},{jp:"とうきょうから ねます。",ro:"Tōkyō kara nemasu."}], explain:"いきます = å gå / reise. Stedet du skal TIL, får partikkelen に (eller へ)."},
  {id:"setn-06", tema:"Setninger", prompt:"Hvordan sier du «Jeg kommer fra Oslo»?", choices:[{jp:"オスロから きました。",ro:"Osuro kara kimashita."},{jp:"オスロに ねます。",ro:"Osuro ni nemasu."},{jp:"オスロを かいます。",ro:"Osuro o kaimasu."},{jp:"オスロで うたです。",ro:"Osuro de uta desu."}], explain:"きました = kom (fortid av きます). から = fra."},
  {id:"setn-07", tema:"Setninger", prompt:"Hvordan sier du «Jeg reiser med tog»?", choices:[{jp:"でんしゃで いきます。",ro:"Densha de ikimasu."},{jp:"でんしゃに たべます。",ro:"Densha ni tabemasu."},{jp:"でんしゃを よみます。",ro:"Densha o yomimasu."},{jp:"でんしゃは みずです。",ro:"Densha wa mizu desu."}], explain:"で markerer middelet: バスで、タクシーで、でんしゃで = med buss / taxi / tog."},
  {id:"setn-08", tema:"Setninger", prompt:"Hvordan sier du «Jeg kjøper en billett»?", choices:[{jp:"きっぷを かいます。",ro:"Kippu o kaimasu."},{jp:"きっぷに いきます。",ro:"Kippu ni ikimasu."},{jp:"きっぷが はしります。",ro:"Kippu ga hashirimasu."},{jp:"きっぷで ねます。",ro:"Kippu de nemasu."}], explain:"かいます = å kjøpe. Ting du kjøper, får を: きっぷを かいます。"},
  {id:"setn-09", tema:"Setninger", prompt:"Hvordan sier du «Vennen min er i parken»?", choices:[{jp:"ともだちは こうえんに います。",ro:"Tomodachi wa kōen ni imasu."},{jp:"ともだちは こうえんを たべます。",ro:"Tomodachi wa kōen o tabemasu."},{jp:"こうえんは ともだちを のみます。",ro:"Kōen wa tomodachi o nomimasu."},{jp:"ともだちで こうえんします。",ro:"Tomodachi de kōen shimasu."}], explain:"います brukes om folk og dyr som befinner seg et sted. に markerer stedet."},
  {id:"setn-10", tema:"Setninger", prompt:"Hvordan sier du «Boka er på bordet»?", choices:[{jp:"ほんは つくえの うえに あります。",ro:"Hon wa tsukue no ue ni arimasu."},{jp:"ほんは つくえを のみます。",ro:"Hon wa tsukue o nomimasu."},{jp:"つくえは ほんが はしります。",ro:"Tsukue wa hon ga hashirimasu."},{jp:"ほんに つくえを します。",ro:"Hon ni tsukue o shimasu."}], explain:"あります brukes om ting. つくえの うえ = oppå bordet. に あります = befinner seg på/i."},
  {id:"setn-11", tema:"Setninger", prompt:"Hvordan sier du «Jeg drikker vann»?", choices:[{jp:"みずを のみます。",ro:"Mizu o nomimasu."},{jp:"みずを たべます。",ro:"Mizu o tabemasu."},{jp:"みずが はしります。",ro:"Mizu ga hashirimasu."},{jp:"みずで ねます。",ro:"Mizu de nemasu."}], explain:"のみます = å drikke, たべます = å spise. Vann drikker du: みずを のみます。"},
  {id:"setn-12", tema:"Setninger", prompt:"Hvordan sier du «Jeg spiser ris»?", choices:[{jp:"ごはんを たべます。",ro:"Gohan o tabemasu."},{jp:"ごはんを のみます。",ro:"Gohan o nomimasu."},{jp:"ごはんに いきます。",ro:"Gohan ni ikimasu."},{jp:"ごはんが かいます。",ro:"Gohan ga kaimasu."}], explain:"ごはん = ris / måltid, たべます = spiser. を foran det du spiser."},
  {id:"setn-13", tema:"Setninger", prompt:"Hvordan sier du «Jeg ser på TV»?", choices:[{jp:"テレビを みます。",ro:"Terebi o mimasu."},{jp:"テレビを ききます。",ro:"Terebi o kikimasu."},{jp:"テレビを のみます。",ro:"Terebi o nomimasu."},{jp:"テレビに ねます。",ro:"Terebi ni nemasu."}], explain:"みます = å se. ききます = å høre (f.eks. på radio eller musikk)."},
  {id:"setn-14", tema:"Setninger", prompt:"Hvordan sier du «Jeg hører på musikk»?", choices:[{jp:"おんがくを ききます。",ro:"Ongaku o kikimasu."},{jp:"おんがくを みます。",ro:"Ongaku o mimasu."},{jp:"おんがくを たべます。",ro:"Ongaku o tabemasu."},{jp:"おんがくに いきます。",ro:"Ongaku ni ikimasu."}], explain:"おんがく = musikk, ききます = å høre / lytte."},
  {id:"setn-15", tema:"Setninger", prompt:"Hvordan sier du «Jeg er trøtt»?", choices:[{jp:"ねむいです。",ro:"Nemui desu."},{jp:"はやいです。",ro:"Hayai desu."},{jp:"おもいです。",ro:"Omoi desu."},{jp:"ひろいです。",ro:"Hiroi desu."}], explain:"ねむい = trøtt. はやい = rask/tidlig, おもい = tung, ひろい = romslig."},
  {id:"setn-16", tema:"Setninger", prompt:"Hvordan sier du «Det er et nytt hotell»?", choices:[{jp:"あたらしい ホテルです。",ro:"Atarashii hoteru desu."},{jp:"ふるい ホテルです。",ro:"Furui hoteru desu."},{jp:"ホテルは ねむいです。",ro:"Hoteru wa nemui desu."},{jp:"ホテルを はしります。",ro:"Hoteru o hashirimasu."}], explain:"あたらしい = ny. ふるい = gammel (om ting, ikke om folk)."},
  {id:"setn-17", tema:"Setninger", prompt:"Hva betyr ふるい?", choices:["gammel (om ting)","ny","rask","tung"], explain:"ふるい = gammel, om ting (et gammelt hus, en gammel bok). Om folk brukes andre ord."},
  {id:"setn-18", tema:"Setninger", prompt:"Hvordan sier du «Jeg kan litt japansk»?", choices:[{jp:"にほんごが すこし できます。",ro:"Nihongo ga sukoshi dekimasu."},{jp:"にほんごが たべられます。",ro:"Nihongo ga taberaremasu."},{jp:"にほんごを のみます。",ro:"Nihongo o nomimasu."},{jp:"にほんごは ねこです。",ro:"Nihongo wa neko desu."}], explain:"できます = å kunne / å få til. すこし = litt. にほんごが すこし できます。"},
  {id:"setn-19", tema:"Setninger", prompt:"Hvordan sier du «La oss gå!»", choices:[{jp:"いきましょう!",ro:"Ikimashō!"},{jp:"いきません!",ro:"Ikimasen!"},{jp:"いきました!",ro:"Ikimashita!"},{jp:"いかないで!",ro:"Ikanaide!"}], explain:"ましょう = la oss … いきましょう = la oss gå! いきません = går ikke, いきました = gikk."},
  {id:"setn-20", tema:"Setninger", prompt:"Hvordan sier du «Jeg spilte fotball i går»?", choices:[{jp:"きのう サッカーを しました。",ro:"Kinō sakkā o shimashita."},{jp:"あした サッカーを します。",ro:"Ashita sakkā o shimasu."},{jp:"サッカーが きのうです。",ro:"Sakkā ga kinō desu."},{jp:"きのうは サッカーを のみました。",ro:"Kinō wa sakkā o nomimashita."}], explain:"しました = gjorde / spilte (fortid). きのう = i går. あした します = jeg skal i morgen."},
  {id:"setn-21", tema:"Setninger", prompt:"Hvordan sier du «I morgen skal jeg spise sushi»?", choices:[{jp:"あした すしを たべます。",ro:"Ashita sushi o tabemasu."},{jp:"きのう すしを たべます。",ro:"Kinō sushi o tabemasu."},{jp:"すしが あした のみます。",ro:"Sushi ga ashita nomimasu."},{jp:"あしたは すしを ききます。",ro:"Ashita wa sushi o kikimasu."}], explain:"あした = i morgen, たべます = spiser / skal spise. Tidsordet kommer ofte først i setningen."},
  {id:"setn-22", tema:"Setninger", prompt:"Hvilken partikkel bruker du i «Jeg går til stasjonen» – えき＿いきます?", choices:[{jp:"に",ro:"ni"},{jp:"を",ro:"o"},{jp:"と",ro:"to"},{jp:"が",ro:"ga"}], explain:"に (eller へ) markerer målet du går til: えきに いきます。"},
  {id:"setn-23", tema:"Setninger", prompt:"Hvilken partikkel: «Jeg spiser sushi» – すし＿たべます?", choices:[{jp:"を",ro:"o"},{jp:"に",ro:"ni"},{jp:"で",ro:"de"},{jp:"と",ro:"to"}], explain:"を markerer det du gjør noe med – her det du spiser: すしを たべます。"},
  {id:"setn-24", tema:"Setninger", prompt:"Hvilken partikkel: «Jeg reiser med buss» – バス＿いきます?", choices:[{jp:"で",ro:"de"},{jp:"を",ro:"o"},{jp:"が",ro:"ga"},{jp:"へ",ro:"e"}], explain:"で markerer middelet du bruker: バスで いきます。 へ brukes mer om retning («mot»)."},
  {id:"setn-25", tema:"Setninger", prompt:"Hvordan sier du «Jeg vil gjerne spise»?", choices:[{jp:"たべたいです。",ro:"Tabetai desu."},{jp:"たべたくないです。",ro:"Tabetakunai desu."},{jp:"たべました。",ro:"Tabemashita."},{jp:"たべません。",ro:"Tabemasen."}], explain:"たいです = å ha lyst til å … たべたいです = jeg vil gjerne spise. たくない = vil ikke."},
  {id:"setn-26", tema:"Setninger", prompt:"Hvordan sier du «Dette er veska mi»?", choices:[{jp:"これは わたしの かばんです。",ro:"Kore wa watashi no kaban desu."},{jp:"これは わたしを かばんです。",ro:"Kore wa watashi o kaban desu."},{jp:"かばんは わたしが のみます。",ro:"Kaban wa watashi ga nomimasu."},{jp:"わたしです かばんの これ。",ro:"Watashi desu kaban no kore."}], explain:"の viser eieform: わたしの かばん = veska mi. これは 〜です = dette er …"},
];
