const PLACES = [
  {id:"tokyo",name:"Tokyo",jp:"とうきょう",kanji:"東京",ro:"Tōkyō",icon:"🗼",journey:true,sub:"Judoens hjemby – Kōdōkan",facts:["Tokyo er hovedstaden i Japan. Navnet 東京 betyr «østlig hovedstad».","Judoens hjem, Kōdōkan (講道館), ble startet her i 1882 av Kanō Jigorō. Den finnes fortsatt.","Tokyo Skytree er et 634 meter høyt tårn der du kan se ut over byen.","I Asakusa ligger Sensō-ji, et av Tokyos eldste templer, med en stor lanterne i porten.","Shibuya er kjent for et stort fotgjengerfelt der mange mennesker krysser samtidig.","Keiseren bor i Det keiserlige palasset, midt i byen, med en stor park rundt."],words:[{no:"Tokyo",jp:"とうきょう",kanji:"東京",ro:"Tōkyō"},{no:"treningssal",jp:"どうじょう",kanji:"道場",ro:"dōjō"},{no:"tog",jp:"でんしゃ",kanji:"電車",ro:"densha"},{no:"stasjon",jp:"えき",kanji:"駅",ro:"eki"},{no:"tårn",jp:"タワー",ro:"tawā"}],questions:[{id:"dest-tokyo-01",tema:"Tokyo",prompt:"Hvordan skrives Tokyo med kanji?",choices:[{jp:"とうきょう",ro:"Tōkyō",kanji:"東京"},{jp:"きょうと",ro:"Kyōto",kanji:"京都"},{jp:"おおさか",ro:"Ōsaka",kanji:"大阪"},{jp:"さっぽろ",ro:"Sapporo",kanji:"札幌"}],explain:"東京 = Tokyo. 東 betyr øst, 京 betyr hovedstad."},{id:"dest-tokyo-02",tema:"Tokyo",prompt:"Judoens viktigste dojo, Kōdōkan (講道館), ligger i:",choices:["Tokyo","Kyoto","Osaka","Sapporo"],explain:"Kōdōkan i Tokyo ble grunnlagt i 1882 av Kanō Jigorō. Det er judoens hjem."},{id:"dest-tokyo-03",tema:"Tokyo",prompt:"Det høye tårnet i Tokyo der du kan se ut over byen, heter:",choices:["Tokyo Skytree","Kinkaku-ji","Tōdai-ji","Tōshō-gū"],explain:"Tokyo Skytree er 634 meter høyt. Fra toppen ser du vida rundt – og av og til Fuji."},{id:"dest-tokyo-04",tema:"Tokyo",prompt:"Sensō-ji i Asakusa er kjent som:",choices:["et av Tokyos eldste templer","et slott av gull","en judoklubb","en flyplass"],explain:"浅草寺 (Sensō-ji) i Asakusa har en stor rød lanterne i porten. Mange går dit for å se og be."},{id:"dest-tokyo-05",tema:"Tokyo",prompt:"Hvordan sier du «Jeg er i Tokyo»?",choices:[{jp:"とうきょうに います。",ro:"Tōkyō ni imasu."},{jp:"とうきょうを たべます。",ro:"Tōkyō o tabemasu."},{jp:"とうきょうは ねこです。",ro:"Tōkyō wa neko desu."},{jp:"とうきょうから ねます。",ro:"Tōkyō kara nemasu."}],explain:"に います = er i / befinner seg i. とうきょうに います。"},{id:"dest-tokyo-06",tema:"Tokyo",prompt:"Shibuya er spesielt kjent for:",choices:["et stort fotgjengerfelt med mange mennesker","en isbre","en ørken","en undersjøisk tunnel til Amerika"],explain:"I Shibuya krysser folk fra mange kanter samtidig. Det er et av de mest kjente stedene i Tokyo."},{id:"dest-tokyo-07",tema:"Tokyo",prompt:"Hvordan spør du «Hvor er Skytree?»",choices:[{jp:"スカイツリーは どこですか。",ro:"Sukaitorī wa doko desu ka."},{jp:"スカイツリーを ください。",ro:"Sukaitorī o kudasai."},{jp:"スカイツリーは おいしいです。",ro:"Sukaitorī wa oishii desu."},{jp:"スカイツリー、はじめ!",ro:"Sukaitorī, hajime!"}],explain:"〜は どこですか = hvor er …? Nyttig foran et kjent landemerke."},{id:"dest-tokyo-08",tema:"Tokyo",prompt:"Hvem bor i Det keiserlige palasset i Tokyo?",choices:["Keiseren","Dommeren i judo","Kapteinen på lyntoget","Ordføreren i Kyoto"],explain:"Palasset ligger midt i Tokyo, med vollgraver og park rundt. Det er keiserfamiliens hjem."},{id:"dest-tokyo-09",tema:"Tokyo",prompt:"Hva betyr kanjiene 東京?",choices:["østlig hovedstad","vestlig tempel","sørlig slott","nordlig fjell"],explain:"東 = øst, 京 = hovedstad. Før het byen Edo. Navnet Tokyo kom da hovedstaden ble flyttet hit."}]},
  {id:"kyoto",name:"Kyoto",jp:"きょうと",kanji:"京都",ro:"Kyōto",icon:"⛩️",journey:true,sub:"Templer og gamle gater",facts:["Kyoto var Japans hovedstad i over tusen år, fra 794 til 1868.","Byen er kjent for templer og helligdommer, blant annet Kinkaku-ji (Det gylne paviljongen).","Ved Fushimi Inari står tusenvis av oransjerøde torii-porter oppover fjellet.","Kiyomizu-dera er et stort tempel med en treterrasse som ser ut over byen.","I bydelen Gion kan du se tradisjonell klesdrakt, musikk og dans.","Kyoto er også kjent for grønn te og fin, milde smaker i maten."],words:[{no:"Kyoto",jp:"きょうと",kanji:"京都",ro:"Kyōto"},{no:"tempel",jp:"てら",kanji:"寺",ro:"tera"},{no:"helligdom",jp:"じんじゃ",kanji:"神社",ro:"jinja"},{no:"port (torii)",jp:"とりい",kanji:"鳥居",ro:"torii"},{no:"grønn te / matcha",jp:"まっちゃ",kanji:"抹茶",ro:"maccha"}],questions:[{id:"dest-kyoto-01",tema:"Kyoto",prompt:"Hvordan skrives Kyoto med kanji?",choices:[{jp:"きょうと",ro:"Kyōto",kanji:"京都"},{jp:"とうきょう",ro:"Tōkyō",kanji:"東京"},{jp:"なら",ro:"Nara",kanji:"奈良"},{jp:"こうべ",ro:"Kōbe",kanji:"神戸"}],explain:"京都 = Kyoto. 京 = hovedstad, 都 = by. Kyoto var hovedstad i over tusen år."},{id:"dest-kyoto-02",tema:"Kyoto",prompt:"Kinkaku-ji er kjent som:",choices:["Det gylne paviljongen","Det høye tårnet i Tokyo","En judohall","Et lyntog"],explain:"金閣寺 (Kinkaku-ji) er et tempel der øverste etasjer er dekket med bladgull. Det speiler seg i dammen foran."},{id:"dest-kyoto-03",tema:"Kyoto",prompt:"Fushimi Inari er spesielt kjent for:",choices:["tusenvis av oransjerøde torii-porter","en skibakke","en flyplass","et fotballstadion"],explain:"Fushimi Inari-helligdommen har lange rekker av røde porter oppover fjellet. Et av Kyotos mest kjente syn."},{id:"dest-kyoto-04",tema:"Kyoto",prompt:"Kyoto var Japans hovedstad fra 794 til:",choices:["1868","1945","1882","1972"],explain:"I 1868 ble hovedstaden flyttet til Tokyo. Kyoto har likevel beholdt mange gamle templer og gater."},{id:"dest-kyoto-05",tema:"Kyoto",prompt:"Kiyomizu-dera er et tempel med:",choices:["en stor treterrasse med utsikt over byen","en innendørs skøytebane","et undervannshotell","en ørkenhage"],explain:"清水寺 (Kiyomizu-dera) betyr omtrent «rent vann-tempelet». Terrassen er bygd i tre og er svært kjent."},{id:"dest-kyoto-06",tema:"Kyoto",prompt:"Hvordan spør du «Hvor er helligdommen?»",choices:[{jp:"じんじゃは どこですか。",ro:"Jinja wa doko desu ka."},{jp:"じんじゃを たべます。",ro:"Jinja o tabemasu."},{jp:"じんじゃは さむいです。",ro:"Jinja wa samui desu."},{jp:"じんじゃ、がんばって。",ro:"Jinja, ganbatte."}],explain:"じんじゃ (神社) = shinto-helligdom. てら (寺) = buddhistisk tempel."},{id:"dest-kyoto-07",tema:"Kyoto",prompt:"Gion i Kyoto er en bydel kjent for:",choices:["tradisjonell klesdrakt, musikk og dans","alpineski","bilsport","en stor fiskeflåte"],explain:"I Gion kan du se gamle trehus og tradisjonell kultur. Gå rolig og vis respekt hvis du møter noen i arbeid der."},{id:"dest-kyoto-08",tema:"Kyoto",prompt:"Kyoto er også kjent for denne drikken:",choices:[{jp:"まっちゃ",ro:"maccha",kanji:"抹茶"},{jp:"コーヒー",ro:"kōhī"},{jp:"ジュース",ro:"jūsu"},{jp:"ミルク",ro:"miruku"}],explain:"抹茶 (maccha) er finmalt grønn te. Kyoto har lange tradisjoner med teseremoni."},{id:"dest-kyoto-09",tema:"Kyoto",prompt:"Hvordan sier du «Her er Kyoto»?",choices:[{jp:"ここは きょうとです。",ro:"Koko wa Kyōto desu."},{jp:"ここは きょうとを のみます。",ro:"Koko wa Kyōto o nomimasu."},{jp:"きょうとは ねこです。",ro:"Kyōto wa neko desu."},{jp:"きょうと、おやすみ。",ro:"Kyōto, oyasumi."}],explain:"ここは 〜です = her er … / dette stedet er …"}]},
  {id:"osaka",name:"Osaka",jp:"おおさか",kanji:"大阪",ro:"Ōsaka",icon:"🐙",journey:true,sub:"Japans matbu – takoyaki!",facts:["Osaka kalles ofte «Japans kjøkken» fordi byen er kjent for gate mat og god, uhøytidelig mat.","Takoyaki – små stekte kuler med blekksprut – kommer herfra.","Dōtonbori er en kjent gate med mange lysskilt, matboder og den berømte Glico-mannen som løper.","Osaka-jø (大阪城), Osaka-slottet, har en stor park rundt seg og er et landemerke i byen.","I Osaka-okonomiyaki røres ingrediensene sammen i røren før den stekes som en tykk pannekake.","Fornøyelsesparken Universal Studios Japan ligger i Osaka – kjent blant barn og unge."],words:[{no:"Osaka",jp:"おおさか",kanji:"大阪",ro:"Ōsaka"},{no:"takoyaki",jp:"たこやき",kanji:"たこ焼き",ro:"takoyaki"},{no:"slott",jp:"しろ",kanji:"城",ro:"shiro"},{no:"godt / deilig",jp:"おいしい",kanji:"美味しい",ro:"oishii"},{no:"kjøkken / mat",jp:"キッチン",ro:"kitchin"}],questions:[{id:"dest-osaka-01",tema:"Osaka",prompt:"Hvordan skrives Osaka med kanji?",choices:[{jp:"おおさか",ro:"Ōsaka",kanji:"大阪"},{jp:"とうきょう",ro:"Tōkyō",kanji:"東京"},{jp:"こうべ",ro:"Kōbe",kanji:"神戸"},{jp:"なごや",ro:"Nagoya",kanji:"名古屋"}],explain:"大阪 = Osaka. En stor by vest i Japan, ikke langt fra Kyoto og Kobe."},{id:"dest-osaka-02",tema:"Osaka",prompt:"Hvorfor kalles Osaka ofte «Japans kjøkken»?",choices:["Byen er kjent for mye god og uhøytidelig mat","Der dyrkes all risen i Japan","Der ligger keiserpalasset","Der starter alle lyntog"],explain:"Osaka har et rykte for å elske mat. Takoyaki og okonomiyaki er typiske smaker fra byen."},{id:"dest-osaka-03",tema:"Osaka",prompt:"Dōtonbori i Osaka er kjent for:",choices:["lys, skilt og masse matboder","en stille bambusskog","en isbre","et keiserpalass"],explain:"道頓堀 (Dōtonbori) er en livlig gate ved kanalen, med store skilt – blant annet Glico-mannen som løper."},{id:"dest-osaka-04",tema:"Osaka",prompt:"Osaka-slottet heter på japansk:",choices:[{jp:"おおさかじょう",ro:"Ōsakajō",kanji:"大阪城"},{jp:"なごやじょう",ro:"Nagoyajō"},{jp:"しろくじょ",ro:"Shirokujo"},{jp:"やまのしろ",ro:"Yama no shiro"}],explain:"城 (じょう) = slott når det står bak et stedsnavn. 大阪城 er et kjent landemerke med park rundt."},{id:"dest-osaka-05",tema:"Osaka",prompt:"Hva er typisk for Osaka-okonomiyaki?",choices:["Ingrediensene røres sammen i røren før den stekes","Den lages bare av is","Den spises bare til frokost i skibakken","Den er alltid søt"],explain:"I Osaka blandes kål og mer i røren. I Hiroshima legges ingrediensene ofte i lag i stedet."},{id:"dest-osaka-06",tema:"Osaka",prompt:"En kjent fornøyelsespark i Osaka er:",choices:["Universal Studios Japan","Kōdōkan","Kenroku-en","Tōshō-gū"],explain:"Universal Studios Japan ligger i Osaka og er et populært sted for familier."},{id:"dest-osaka-07",tema:"Osaka",prompt:"Du er sulten i Osaka. Hva sier du?",choices:[{jp:"おなかが すきました。",ro:"Onaka ga sukimashita."},{jp:"ねむくないです。",ro:"Nemukunai desu."},{jp:"さむいです。",ro:"Samui desu."},{jp:"たかすぎます、ねこ。",ro:"Takasugimasu, neko."}],explain:"おなかが すきました = jeg er sulten. En nyttig setning i «Japans kjøkken»."},{id:"dest-osaka-08",tema:"Osaka",prompt:"Takoyaki kommer særlig fra Osaka. Hva er たこ?",choices:["blekksprut","ost","sjokolade","ris"],explain:"たこ = blekksprut, やき = stekt. Små, runde og ofte spist med pinne rett fra stova."},{id:"dest-osaka-09",tema:"Osaka",prompt:"Hvordan sier du «Jeg skal til Osaka»?",choices:[{jp:"おおさかに いきます。",ro:"Ōsaka ni ikimasu."},{jp:"おおさかを たべます。",ro:"Ōsaka o tabemasu."},{jp:"おおさかは いぬです。",ro:"Ōsaka wa inu desu."},{jp:"おおさかから ねます。",ro:"Ōsaka kara nemasu."}],explain:"に いきます = skal til / reiser til."}]},
  {id:"hiroshima",name:"Hiroshima",jp:"ひろしま",kanji:"広島",ro:"Hiroshima",icon:"🕊️",journey:true,sub:"Fredsbyen og øya Miyajima",facts:["I 1945 ble Hiroshima rammet av en atombombe. I dag er byen en fredsby.","Fredsparken og Fredsmuseet minner om at krig aldri må skje igjen. Der står også Atombombe-domen.","På øya Miyajima (Itsukushima) står en kjent rød torii-port ute i vannet.","Hiroshima-okonomiyaki lages ofte i lag, med kål og nudler.","I byen kan du kjøre trikk gjennom gatene – en gammel og praktisk måte å reise på.","Bilmerket Mazda har røtter i Hiroshima."],words:[{no:"Hiroshima",jp:"ひろしま",kanji:"広島",ro:"Hiroshima"},{no:"fred",jp:"へいわ",kanji:"平和",ro:"heiwa"},{no:"øy",jp:"しま",kanji:"島",ro:"shima"},{no:"port (torii)",jp:"とりい",kanji:"鳥居",ro:"torii"},{no:"trikk",jp:"でんしゃ",kanji:"電車",ro:"densha"}],questions:[{id:"dest-hiroshima-01",tema:"Hiroshima",prompt:"Hvordan skrives Hiroshima med kanji?",choices:[{jp:"ひろしま",ro:"Hiroshima",kanji:"広島"},{jp:"ふくおか",ro:"Fukuoka",kanji:"福岡"},{jp:"かなざわ",ro:"Kanazawa",kanji:"金沢"},{jp:"おきなわ",ro:"Okinawa",kanji:"沖縄"}],explain:"広島 = Hiroshima. 広 kan bety vid, 島 betyr øy."},{id:"dest-hiroshima-02",tema:"Hiroshima",prompt:"Hvorfor kalles Hiroshima en fredsby?",choices:["Byen jobber for fred etter atombomben i 1945","Der ble judo oppfunnet","Der bor keiseren","Der er det aldri regn"],explain:"Fredsparken, museet og Atombombe-domen minner oss om hvor viktig fred er. へいわ = fred."},{id:"dest-hiroshima-03",tema:"Hiroshima",prompt:"Øya med den røde porten i vannet heter:",choices:["Miyajima (Itsukushima)","Shibuya","Nara-parken","Lake Ashi"],explain:"宮島 (Miyajima), også kalt Itsukushima, er kjent for torii-porten som står i sjøen."},{id:"dest-hiroshima-04",tema:"Hiroshima",prompt:"Hva er typisk for Hiroshima-okonomiyaki?",choices:["Den lages i lag, ofte med kål og nudler","Den er bare søt is","Den lages uten plate","Den kommer fra Sapporo"],explain:"I Hiroshima bygger kokken lag på lag. I Osaka røres det mer sammen. Begge er gode – bare ulike stiler."},{id:"dest-hiroshima-05",tema:"Hiroshima",prompt:"I gatene i Hiroshima kan du fortsatt kjøre:",choices:["trikk","hundespann","underjordisk båt","taktog gjennom ørkenen"],explain:"Trikken er en praktisk og gammel del av bybildet. På japansk er det en type でんしゃ."},{id:"dest-hiroshima-06",tema:"Hiroshima",prompt:"Hvordan sier du «fred» på japansk?",choices:[{jp:"へいわ",ro:"heiwa",kanji:"平和"},{jp:"せんそう",ro:"sensō"},{jp:"かぜ",ro:"kaze"},{jp:"やま",ro:"yama"}],explain:"平和 (へいわ) = fred. Et viktig ord i Hiroshima."},{id:"dest-hiroshima-07",tema:"Hiroshima",prompt:"Hvordan sier du «Jeg skal til Hiroshima»?",choices:[{jp:"ひろしまに いきます。",ro:"Hiroshima ni ikimasu."},{jp:"ひろしまを のみます。",ro:"Hiroshima o nomimasu."},{jp:"ひろしまは ボールです。",ro:"Hiroshima wa bōru desu."},{jp:"ひろしま、おやすみ。",ro:"Hiroshima, oyasumi."}],explain:"に いきます = skal til."},{id:"dest-hiroshima-08",tema:"Hiroshima",prompt:"Hvilken kjent bilprodusent har røtter i Hiroshima?",choices:["Mazda","Toyota (hovedkontor i Aichi, nær Nagoya)","Volvo","Ferrari"],explain:"Mazda har sterk tilknytning til Hiroshima. (Toyota hører mer til området rundt Nagoya.)"},{id:"dest-hiroshima-09",tema:"Hiroshima",prompt:"Hva betyr 島 i navnet 広島 og i 宮島?",choices:["øy","fjell","elv","bro"],explain:"島 = øy. Du ser det både i Hiroshima og i Miyajima."}]},
  {id:"fukuoka",name:"Fukuoka",jp:"ふくおか",kanji:"福岡",ro:"Fukuoka",icon:"🍜",journey:true,sub:"Hjembyen til Hakata-ramen",facts:["Fukuoka er en stor by på øya Kyūshū, sør-vest i Japan.","Byen er kjent for Hakata-ramen, ofte med kraftig suppe av svinebein (tonkotsu).","Om kvelden kan du se yatai – små, åpne matboder langs elva og gatene.","Hakata er det gamle navnet på den ene delen av byen, og brukes fortsatt om stasjonen og ramenen.","Hakata Gion Yamakasa er en kjent festival der lag bærer store, pyntede vogner gjennom byen.","Mentaiko – krydret torskerogn – er en typisk smak fra Fukuoka."],words:[{no:"Fukuoka",jp:"ふくおか",kanji:"福岡",ro:"Fukuoka"},{no:"Hakata",jp:"はかた",kanji:"博多",ro:"Hakata"},{no:"matbod (yatai)",jp:"やたい",kanji:"屋台",ro:"yatai"},{no:"ramen",jp:"ラーメン",ro:"rāmen"},{no:"øy",jp:"しま",kanji:"島",ro:"shima"}],questions:[{id:"dest-fukuoka-01",tema:"Fukuoka",prompt:"Hvordan skrives Fukuoka med kanji?",choices:[{jp:"ふくおか",ro:"Fukuoka",kanji:"福岡"},{jp:"ひろしま",ro:"Hiroshima",kanji:"広島"},{jp:"さっぽろ",ro:"Sapporo",kanji:"札幌"},{jp:"なごや",ro:"Nagoya",kanji:"名古屋"}],explain:"福岡 = Fukuoka. En stor by på Kyūshū."},{id:"dest-fukuoka-02",tema:"Fukuoka",prompt:"Hakata-ramen fra Fukuoka er ofte:",choices:["kraftig, laget på svinebein (tonkotsu)","helt uten suppe","en type is","en søt kake"],explain:"とんこつラーメン er kjent fra Hakata/Fukuoka: hvit, kraftig suppe og tynne nudler."},{id:"dest-fukuoka-03",tema:"Fukuoka",prompt:"Hva er やたい (屋台) i Fukuoka?",choices:["små, åpne matboder utendørs","et slott","en skiheis","en type lyntog"],explain:"屋台 er typiske for Fukuoka, særlig om kvelden ved elva. Du kan sitte og spise ramen under taket."},{id:"dest-fukuoka-04",tema:"Fukuoka",prompt:"Fukuoka ligger på øya:",choices:["Kyūshū","Hokkaidō","Okinawa","Shikoku"],explain:"Kyūshū er den sørvestlige av Japans hovedøyer. Fukuoka er en inngangsbom til øya."},{id:"dest-fukuoka-05",tema:"Fukuoka",prompt:"Hakata Gion Yamakasa er:",choices:["en kjent festival i Fukuoka","et fjell i Tokyo","en type sushi","et judokast"],explain:"Under festivalen bærer lag store, pyntede vogner gjennom gatene. Hakata er et gammelt navn som fortsatt brukes."},{id:"dest-fukuoka-06",tema:"Fukuoka",prompt:"En typisk smak fra Fukuoka er mentaiko. Hva er det?",choices:["krydret torskerogn","grillet ål i sjokolade","en iskrem med te","tørket eple"],explain:"明太子 (mentaiko) er en kjent spesialitet fra Fukuoka, ofte spist med ris eller i pasta."},{id:"dest-fukuoka-07",tema:"Fukuoka",prompt:"Hvordan spør du «Hvor er matboden?»",choices:[{jp:"やたいは どこですか。",ro:"Yatai wa doko desu ka."},{jp:"やたいを きります。",ro:"Yatai o kirimasu."},{jp:"やたいは さむいね、いぬ。",ro:"Yatai wa samui ne, inu."},{jp:"やたい、おやすみ。",ro:"Yatai, oyasumi."}],explain:"やたいは どこですか = hvor er matboden?"},{id:"dest-fukuoka-08",tema:"Fukuoka",prompt:"Hvordan sier du «Jeg skal til Fukuoka»?",choices:[{jp:"ふくおかに いきます。",ro:"Fukuoka ni ikimasu."},{jp:"ふくおかを のみます。",ro:"Fukuoka o nomimasu."},{jp:"ふくおかは ぼーるです。",ro:"Fukuoka wa bōru desu."},{jp:"ふくおかから ねます。",ro:"Fukuoka kara nemasu."}],explain:"に いきます = skal til."},{id:"dest-fukuoka-09",tema:"Fukuoka",prompt:"Hakata er:",choices:["et gammelt navn som fortsatt brukes om en del av Fukuoka","et fjell på Hokkaido","keiserens slott i Tokyo","et annet ord for judo"],explain:"博多 (Hakata) er blant annet navnet på hovedstasjonen og på den kjente ramenen."}]},
  {id:"sapporo",name:"Sapporo",jp:"さっぽろ",kanji:"札幌",ro:"Sapporo",icon:"❄️",journey:true,sub:"Snøfestival – finalen mot sensei",facts:["Sapporo er hovedstaden på Hokkaidō, Japans nordlige hovedøy.","Snøfestivalen (ゆきまつり) er kjent for store skulpturer av snø og is, som regel i februar.","Byen arrangerte vinter-OL i 1972.","Sapporo-ramen er ofte miso-ramen, med en fyldig, rødbrun suppe.","Klokketårnet (時計台) er et gammelt, trebygget landemerke midt i byen.","Soup curry – en suppe med karri og grønnsaker – er også en populær rett her."],words:[{no:"Sapporo",jp:"さっぽろ",kanji:"札幌",ro:"Sapporo"},{no:"snø",jp:"ゆき",kanji:"雪",ro:"yuki"},{no:"festival",jp:"まつり",kanji:"祭り",ro:"matsuri"},{no:"kaldt",jp:"さむい",kanji:"寒い",ro:"samui"},{no:"Hokkaido",jp:"ほっかいどう",kanji:"北海道",ro:"Hokkaidō"}],questions:[{id:"dest-sapporo-01",tema:"Sapporo",prompt:"Hvordan skrives Sapporo med kanji?",choices:[{jp:"さっぽろ",ro:"Sapporo",kanji:"札幌"},{jp:"とうきょう",ro:"Tōkyō",kanji:"東京"},{jp:"あおもり",ro:"Aomori",kanji:"青森"},{jp:"はこね",ro:"Hakone",kanji:"箱根"}],explain:"札幌 = Sapporo, hovedstaden på Hokkaidō."},{id:"dest-sapporo-02",tema:"Sapporo",prompt:"Sapporo-snøfestivalen er kjent for store skulpturer, som regel i:",choices:["februar","juli","oktober","mai"],explain:"ゆきまつり holdes om vinteren, vanligvis i februar, med store figurer av snø og is."},{id:"dest-sapporo-03",tema:"Sapporo",prompt:"Sapporo arrangerte vinter-OL i:",choices:["1972","1882","1868","1945"],explain:"I 1972 var Sapporo den første byen i Asia som arrangerte et vinter-OL."},{id:"dest-sapporo-04",tema:"Sapporo",prompt:"Sapporo-ramen er ofte:",choices:["miso-ramen","bare kald nuddel-salat","en type kake","uten nudler"],explain:"Miso gir en fyldig, rødbrun suppe. Hokkaidō er kjent for denne stilen."},{id:"dest-sapporo-05",tema:"Sapporo",prompt:"Sapporo er hovedstad på:",choices:[{jp:"ほっかいどう",ro:"Hokkaidō",kanji:"北海道"},{jp:"きゅうしゅう",ro:"Kyūshū",kanji:"九州"},{jp:"おきなわ",ro:"Okinawa",kanji:"沖縄"},{jp:"しこく",ro:"Shikoku",kanji:"四国"}],explain:"北海道 = Hokkaidō, den store øya i nord. Der kan det være skikkelig さむい om vinteren."},{id:"dest-sapporo-06",tema:"Sapporo",prompt:"Klokketårnet i Sapporo er:",choices:["et gammelt trebygning-landemerke midt i byen","et 634 meter høyt tårn","et slott av gull","en judohall"],explain:"時計台 (tokeidai) er lite og gammelt, og et kjent møtested i sentrum."},{id:"dest-sapporo-07",tema:"Sapporo",prompt:"En populær rett i Sapporo, ved siden av ramen, er:",choices:["soup curry","takoyaki (fra Osaka)","mentai-pasta fra Fukuoka","kaisike fra Kyoto"],explain:"Soup curry er en varm suppe med karri, grønnsaker og ofte kylling. God når det er kaldt!"},{id:"dest-sapporo-08",tema:"Sapporo",prompt:"Hvordan sier du «Jeg er i Sapporo»?",choices:[{jp:"さっぽろに います。",ro:"Sapporo ni imasu."},{jp:"さっぽろを たべます。",ro:"Sapporo o tabemasu."},{jp:"さっぽろは いすです。",ro:"Sapporo wa isu desu."},{jp:"さっぽろから ねます。",ro:"Sapporo kara nemasu."}],explain:"に います = er i."},{id:"dest-sapporo-09",tema:"Sapporo",prompt:"Hva betyr ゆき in ゆきまつり?",choices:["snø","regn","vind","blomst"],explain:"ゆき (雪) = snø, まつり (祭り) = festival. Snøfestivalen er Sapporos mest kjente feiring."}]},
  {id:"nara",name:"Nara",jp:"なら",kanji:"奈良",ro:"Nara",icon:"🦌",journey:false,sub:"Hjorter og den store Buddha",facts:["Nara var Japans første faste hovedstad, kalt Heijō-kyō, fra 710 til 784.","I Nara-parken går sikahjort fritt blant folk. Mange av dem bøyer hodet når de vil ha en kjeks.","I tempelet Tōdai-ji sitter en enorm bronse-Buddha, kalt daibutsu (大仏).","Du kan kjøpe しかせんべい – spesielle kjeks som er laget til hjortene (ikke til oss).","Kasuga-taisha er en helligdom kjent for mange steinlykter langs stiene.","Nara ligger sør for Kyoto og er en typisk dagsutflukt derfra."],words:[{no:"Nara",jp:"なら",kanji:"奈良",ro:"Nara"},{no:"hjort",jp:"しか",kanji:"鹿",ro:"shika"},{no:"stor Buddha",jp:"だいぶつ",kanji:"大仏",ro:"daibutsu"},{no:"tempel",jp:"てら",kanji:"寺",ro:"tera"},{no:"park",jp:"こうえん",kanji:"公園",ro:"kōen"}],questions:[{id:"dest-nara-01",tema:"Nara",prompt:"Hvordan skrives Nara med kanji?",choices:[{jp:"なら",ro:"Nara",kanji:"奈良"},{jp:"きょうと",ro:"Kyōto",kanji:"京都"},{jp:"かまくら",ro:"Kamakura",kanji:"鎌倉"},{jp:"にっこう",ro:"Nikkō",kanji:"日光"}],explain:"奈良 = Nara. Japans første faste hovedstad lå her."},{id:"dest-nara-02",tema:"Nara",prompt:"Hva er spesielt med Nara-parken?",choices:["Sikahjort går fritt blant folk","Det er en innendørs skibakke","Der står Tokyo Skytree","Der ligger Kōdōkan"],explain:"Hjortene er en del av byens preg. Mange bøyer hodet – nesten som en liten れい – når de vil ha kjeks."},{id:"dest-nara-03",tema:"Nara",prompt:"Den store Buddha-statuen kalles:",choices:[{jp:"だいぶつ",ro:"daibutsu",kanji:"大仏"},{jp:"とりい",ro:"torii"},{jp:"おんせん",ro:"onsen"},{jp:"やたい",ro:"yatai"}],explain:"大仏 = stor Buddha. I Tōdai-ji i Nara sitter en veldig stor statue av bronse."},{id:"dest-nara-04",tema:"Nara",prompt:"Nara var Japans første faste hovedstad fra 710 til:",choices:["784","1868","1945","1972"],explain:"Hovedstaden het Heijō-kyō. I 794 ble hovedstaden flyttet til Kyoto."},{id:"dest-nara-05",tema:"Nara",prompt:"Hvordan sier du «hjort» på japansk?",choices:[{jp:"しか",ro:"shika",kanji:"鹿"},{jp:"ねこ",ro:"neko"},{jp:"いぬ",ro:"inu"},{jp:"とり",ro:"tori"}],explain:"鹿 (しか) = hjort. Kjeksene heter しかせんべい."},{id:"dest-nara-06",tema:"Nara",prompt:"しかせんべい er:",choices:["spesielle kjeks til hjortene","en type sushi","et judobelte","et lyntog"],explain:"Kjøp dem i parken og gi dem rolig til hjorten. De er ikke ment som snack til mennesker."},{id:"dest-nara-07",tema:"Nara",prompt:"Tempelet med den store Buddha i Nara heter:",choices:["Tōdai-ji","Kinkaku-ji","Kōdōkan","Tōshō-gū"],explain:"東大寺 (Tōdai-ji) er et av Japans mest kjente templer, nettopp på grunn av daibutsu."},{id:"dest-nara-08",tema:"Nara",prompt:"Hvordan sier du «Jeg skal til Nara»?",choices:[{jp:"ならに いきます。",ro:"Nara ni ikimasu."},{jp:"ならを たべます。",ro:"Nara o tabemasu."},{jp:"ならは ボールです。",ro:"Nara wa bōru desu."},{jp:"ならから ねます。",ro:"Nara kara nemasu."}],explain:"に いきます = skal til. Nara er en lett tur fra Kyoto."},{id:"dest-nara-09",tema:"Nara",prompt:"Kasuga-taisha i Nara er kjent for:",choices:["mange steinlykter langs stiene","en innendørs skiheis","et fiskemarked på taket","et fotballmuseum"],explain:"Kasuga-taisha er en gammel helligdom. Steinlyktene tennes ved spesielle anledninger."}]},
  {id:"okinawa",name:"Okinawa",jp:"おきなわ",kanji:"沖縄",ro:"Okinawa",icon:"🏖️",journey:false,sub:"Øyer, hav og karate",facts:["Okinawa er en øygruppe sør i Japan, med varmt klima og fine strender.","Karate oppstod her, i det gamle Ryūkyū-riket, før det spredte seg til resten av Japan og verden.","På tak og porter ser du ofte shīsā (シーサー) – løve-hund-figurer som skal beskytte huset.","Shurijō i Naha er et kjent slott fra Ryūkyū-riket. Det har blitt bygd opp igjen etter branner.","Okinawa-soba er ikke de samme tynne bokhvete-nudlene som på hovedøyene, men tykkere hvetenudler i suppe.","Havet rundt øyene er turkost, og うみ (hav) er et viktig ord her."],words:[{no:"Okinawa",jp:"おきなわ",kanji:"沖縄",ro:"Okinawa"},{no:"hav",jp:"うみ",kanji:"海",ro:"umi"},{no:"øy",jp:"しま",kanji:"島",ro:"shima"},{no:"slott",jp:"しろ",kanji:"城",ro:"shiro"},{no:"karate",jp:"からて",kanji:"空手",ro:"karate"}],questions:[{id:"dest-okinawa-01",tema:"Okinawa",prompt:"Hvordan skrives Okinawa med kanji?",choices:[{jp:"おきなわ",ro:"Okinawa",kanji:"沖縄"},{jp:"ほっかいどう",ro:"Hokkaidō",kanji:"北海道"},{jp:"ふくおか",ro:"Fukuoka",kanji:"福岡"},{jp:"なら",ro:"Nara",kanji:"奈良"}],explain:"沖縄 = Okinawa, øygruppen langt sør i Japan."},{id:"dest-okinawa-02",tema:"Okinawa",prompt:"Hvilken kampsport oppstod i Okinawa?",choices:["karate","judo (grunnlagt i Tokyo)","sumo i Edo-slottet","alpin ski"],explain:"空手 (karate) har røtter i Ryūkyū/Okinawa. Judo ble grunnlagt av Kanō Jigorō i Tokyo."},{id:"dest-okinawa-03",tema:"Okinawa",prompt:"Hva er シーサー (shīsā) i Okinawa?",choices:["løve-hund-figurer som skal beskytte huset","en type lyntog","et judokast","en iskrem"],explain:"Du ser dem ofte i par på tak og ved porter: én med åpen munn og én med lukket."},{id:"dest-okinawa-04",tema:"Okinawa",prompt:"Shurijō i Naha er:",choices:["et kjent slott fra Ryūkyū-riket","Tokyo Skytree","Kōdōkan","en skiheis"],explain:"首里城 har blitt ødelagt og bygd opp igjen flere ganger, sist etter en brann i 2019. Det er likevel et viktig symbol."},{id:"dest-okinawa-05",tema:"Okinawa",prompt:"Hvordan sier du «hav» på japansk?",choices:[{jp:"うみ",ro:"umi",kanji:"海"},{jp:"やま",ro:"yama"},{jp:"かわ",ro:"kawa"},{jp:"もり",ro:"mori"}],explain:"海 (うみ) = hav. Et naturlig ord å lære når du tenker på Okinawa."},{id:"dest-okinawa-06",tema:"Okinawa",prompt:"Okinawa-soba er:",choices:["tykkere hvetenudler i suppe","de samme tynne bokhvete-nudlene som i Tokyo","en type kake","grillet fisk uten nudel"],explain:"Navnet «soba» kan være forvirrende. På Okinawa er det en egen, lokal nudelrett."},{id:"dest-okinawa-07",tema:"Okinawa",prompt:"Hvordan sier du «Jeg skal til Okinawa»?",choices:[{jp:"おきなわに いきます。",ro:"Okinawa ni ikimasu."},{jp:"おきなわを たべます。",ro:"Okinawa o tabemasu."},{jp:"おきなわは いぬです。",ro:"Okinawa wa inu desu."},{jp:"おきなわから ねます。",ro:"Okinawa kara nemasu."}],explain:"に いきます = skal til. Dit reiser de fleste med fly."},{id:"dest-okinawa-08",tema:"Okinawa",prompt:"På Okinawa hører du av og til はいさい. Det er:",choices:["en måte å si hei på i den lokale dialekten","et judokast","et fjell","en type belte"],explain:"はいさい brukes som hilsen i Okinawa. På standardspråket sier du こんにちは."},{id:"dest-okinawa-09",tema:"Okinawa",prompt:"Hvordan skriver du karate med kanji?",choices:[{jp:"からて",ro:"karate",kanji:"空手"},{jp:"じゅうどう",ro:"jūdō",kanji:"柔道"},{jp:"すもう",ro:"sumō"},{jp:"けんどう",ro:"kendō",kanji:"剣道"}],explain:"空手 betyr omtrent «tom hånd». 柔道 = judo, «den myke veien»."}]},
  {id:"nikko",name:"Nikkō",jp:"にっこう",kanji:"日光",ro:"Nikkō",icon:"🌲",journey:false,sub:"Helligdommer blant sedertre",facts:["Nikkō ligger nord for Tokyo, i fjellene i Tochigi.","Tōshō-gū er en rikt pyntet helligdom for shogunen Tokugawa Ieyasu.","Et gammelt ordtak sier: «Si ikke kekkō (flott nok) før du har sett Nikkō.»","Blant treskjæringene på Tōshō-gū finner du de tre apene som ikke ser, hører eller sier noe ondt – og den lille sovende katten.","Kegon-fossen og innsjøen Chūzenji ligger like ved, oppe i fjellet.","Navnet 日光 betyr omtrent «sollys»: 日 = sol, 光 = lys."],words:[{no:"Nikkō",jp:"にっこう",kanji:"日光",ro:"Nikkō"},{no:"lys",jp:"ひかり",kanji:"光",ro:"hikari"},{no:"sol / dag",jp:"ひ",kanji:"日",ro:"hi"},{no:"fossefall",jp:"たき",kanji:"滝",ro:"taki"},{no:"helligdom",jp:"じんじゃ",kanji:"神社",ro:"jinja"}],questions:[{id:"dest-nikko-01",tema:"Nikkō",prompt:"Hvordan skrives Nikkō med kanji?",choices:[{jp:"にっこう",ro:"Nikkō",kanji:"日光"},{jp:"とうきょう",ro:"Tōkyō",kanji:"東京"},{jp:"きょうと",ro:"Kyōto",kanji:"京都"},{jp:"はこね",ro:"Hakone",kanji:"箱根"}],explain:"日光 = Nikkō. 日 = sol, 光 = lys."},{id:"dest-nikko-02",tema:"Nikkō",prompt:"Tōshō-gū i Nikkō er en helligdom for:",choices:["Tokugawa Ieyasu","Kanō Jigorō","keiseren som bor i Tokyo","oppfinneren av takoyaki"],explain:"Tōshō-gū er rikt utskåret og malt. Ieyasu var grunnleggeren av Tokugawa-shogunatet."},{id:"dest-nikko-03",tema:"Nikkō",prompt:"Det gamle ordtaket om Nikkō sier omtrent:",choices:["Si ikke «flott nok» før du har sett Nikkō","Løp forbi uten å se deg tilbake","Bare reis dit om sommeren","Der er det aldri regn"],explain:"「日光を見ずして結構と言うなかれ」 – et klassisk rosende ordtak om stedet."},{id:"dest-nikko-04",tema:"Nikkō",prompt:"På Tōshō-gū kan du finne en kjent treskjæring av:",choices:["tre aper som ikke ser, hører eller sier noe ondt","en jumbo-jet","en fotball","et lyntog"],explain:"De tre apene er et kjent motiv. Der finnes også en liten «sovende katt»."},{id:"dest-nikko-05",tema:"Nikkō",prompt:"Hva betyr 光 (ひかり)?",choices:["lys","mørke","vind","salt"],explain:"光 = lys. Det er det andre tegnet i 日光."},{id:"dest-nikko-06",tema:"Nikkō",prompt:"Kegon i Nikkō er kjent som:",choices:["en foss, like ved innsjøen Chūzenji","et slott av gull","en judoklubb","en flyplass"],explain:"華厳の滝 (Kegon no taki) er en av de mest kjente fossene i Japan, oppe i fjellet ved Nikkō."},{id:"dest-nikko-07",tema:"Nikkō",prompt:"Hvordan sier du «Jeg skal til Nikkō»?",choices:[{jp:"にっこうに いきます。",ro:"Nikkō ni ikimasu."},{jp:"にっこうを のみます。",ro:"Nikkō o nomimasu."},{jp:"にっこうは ねこです。",ro:"Nikkō wa neko desu."},{jp:"にっこうから ねます。",ro:"Nikkō kara nemasu."}],explain:"に いきます = skal til. Nikkō er en typisk tur fra Tokyo."},{id:"dest-nikko-08",tema:"Nikkō",prompt:"Hvordan sier du «fossefall»?",choices:[{jp:"たき",ro:"taki",kanji:"滝"},{jp:"かわ",ro:"kawa"},{jp:"うみ",ro:"umi"},{jp:"もり",ro:"mori"}],explain:"滝 (たき) = foss. 川 = elv, 海 = hav, 森 = skog."},{id:"dest-nikko-09",tema:"Nikkō",prompt:"Nikkō ligger:",choices:["i fjellet nord for Tokyo","på Okinawa","inne i Osaka-slottet","på Hokkaidō"],explain:"Nikkō ligger i Tochigi, i fjellene. Om høsten er løvet særlig fint."}]},
  {id:"kamakura",name:"Kamakura",jp:"かまくら",kanji:"鎌倉",ro:"Kamakura",icon:"🧘",journey:false,sub:"Daibutsu ved havet",facts:["Kamakura ligger ved havet, sør for Tokyo, og er en typisk dagsutflukt derfra.","Her lå det første samurai-styret i Japan, Kamakura-shogunatet, fra 1185 til 1333.","Utenfor tempelet Kōtoku-in sitter en stor bronse-Buddha under åpen himmel. Du kan til og med gå inn i statuen.","Tsurugaoka Hachimangū er byens viktigste helligdom, med en lang gate opp mot den.","Hase-dera er et annet kjent tempel, med utsikt mot sjøen.","På strendene i Kamakura og nabobyen kan du bade om sommeren."],words:[{no:"Kamakura",jp:"かまくら",kanji:"鎌倉",ro:"Kamakura"},{no:"stor Buddha",jp:"だいぶつ",kanji:"大仏",ro:"daibutsu"},{no:"hav",jp:"うみ",kanji:"海",ro:"umi"},{no:"tempel",jp:"てら",kanji:"寺",ro:"tera"},{no:"samurai (kriger)",jp:"さむらい",kanji:"侍",ro:"samurai"}],questions:[{id:"dest-kamakura-01",tema:"Kamakura",prompt:"Hvordan skrives Kamakura med kanji?",choices:[{jp:"かまくら",ro:"Kamakura",kanji:"鎌倉"},{jp:"かなざわ",ro:"Kanazawa",kanji:"金沢"},{jp:"くまもと",ro:"Kumamoto",kanji:"熊本"},{jp:"なら",ro:"Nara",kanji:"奈良"}],explain:"鎌倉 = Kamakura, en by ved havet sør for Tokyo."},{id:"dest-kamakura-02",tema:"Kamakura",prompt:"Kamakura-shogunatet, det første samurai-styret, varte fra 1185 til:",choices:["1333","1868","794","1972"],explain:"Fra 1185 til 1333 var Kamakura maktsenteret for samuraiene, før makten senere flyttet videre."},{id:"dest-kamakura-03",tema:"Kamakura",prompt:"Daibutsu i Kamakura er spesiell fordi den:",choices:["sitter under åpen himmel, og du kan gå inn i den","står på bunnen av en innsjø","er laget av is","står inne i Tokyo Skytree"],explain:"I Kōtoku-in sitter Buddha i friluft. Taket forsvant i en storm for flere hundre år siden, og slik har den blitt stående."},{id:"dest-kamakura-04",tema:"Kamakura",prompt:"Kamakura ligger:",choices:["ved havet, sør for Tokyo","på Hokkaidō","inne i Kyoto-stasjonen","på Okinawa"],explain:"Det er en typisk dagsutflukt med tog fra Tokyo. Du kan kombinere templer og strand."},{id:"dest-kamakura-05",tema:"Kamakura",prompt:"Hvordan sier du «stor Buddha»?",choices:[{jp:"だいぶつ",ro:"daibutsu",kanji:"大仏"},{jp:"おんせん",ro:"onsen"},{jp:"しんかんせん",ro:"shinkansen"},{jp:"やたい",ro:"yatai"}],explain:"大仏 brukes både i Kamakura og i Nara, men statuene og stedene er ulike."},{id:"dest-kamakura-06",tema:"Kamakura",prompt:"Tsurugaoka Hachimangū er:",choices:["den viktigste helligdommen i Kamakura","et lyntog","en type ramen","et judokast"],explain:"En lang gate fører opp mot helligdommen. Den er byens midtpunkt ved festivaler."},{id:"dest-kamakura-07",tema:"Kamakura",prompt:"Hvordan sier du «Jeg skal til Kamakura»?",choices:[{jp:"かまくらに いきます。",ro:"Kamakura ni ikimasu."},{jp:"かまくらを のみます。",ro:"Kamakura o nomimasu."},{jp:"かまくらは いすです。",ro:"Kamakura wa isu desu."},{jp:"かまくらから ねます。",ro:"Kamakura kara nemasu."}],explain:"に いきます = skal til."},{id:"dest-kamakura-08",tema:"Kamakura",prompt:"Hvordan sier du «hav»?",choices:[{jp:"うみ",ro:"umi",kanji:"海"},{jp:"やま",ro:"yama"},{jp:"かわ",ro:"kawa"},{jp:"もり",ro:"mori"}],explain:"海 (うみ) = hav. Kamakura ligger rett ved sjøen."},{id:"dest-kamakura-09",tema:"Kamakura",prompt:"Hase-dera i Kamakura er kjent for:",choices:["et tempel med utsikt mot sjøen","en innendørs skøytebane","Kōdōkan","et gullslott"],explain:"長谷寺 (Hase-dera) ligger i bakken, og fra hagen kan du se mot havet."}]},
  {id:"fuji",name:"Fuji-san",jp:"ふじさん",kanji:"富士山",ro:"Fuji-san",icon:"🗻",journey:false,sub:"Japans høyeste fjell",facts:["Fuji-san er Japans høyeste fjell, 3776 meter over havet.","Det er en vulkan som nå er i ro, og et av de mest kjente symbolene på Japan.","Fjellet står på UNESCOs verdensarvliste.","Mange klatrer om sommeren, typisk i juli og august, når de offisielle løypene er åpne.","På klare dager kan du se Fuji fra lyntoget mellom Tokyo og Kyoto eller Osaka.","Fra Hakone og flere innsjøer rundt fjellet er det også fine utsikter når skyene letter."],words:[{no:"Fuji-san",jp:"ふじさん",kanji:"富士山",ro:"Fuji-san"},{no:"fjell",jp:"やま",kanji:"山",ro:"yama"},{no:"vulkan",jp:"かざん",kanji:"火山",ro:"kazan"},{no:"topp / fjelltopp",jp:"いただき",kanji:"頂",ro:"itadaki"},{no:"utsikt",jp:"けしき",kanji:"景色",ro:"keshiki"}],questions:[{id:"dest-fuji-01",tema:"Fuji-san",prompt:"Hvordan skrives Mount Fuji med kanji?",choices:[{jp:"ふじさん",ro:"Fuji-san",kanji:"富士山"},{jp:"たかさん",ro:"Taka-san"},{jp:"やまさん",ro:"Yama-san"},{jp:"うみやま",ro:"Umiyama"}],explain:"富士山 = Fuji-san. 山 betyr fjell. På japansk sier vi Fuji-san, ikke «Mount» først."},{id:"dest-fuji-02",tema:"Fuji-san",prompt:"Hvor høyt er Fuji-san?",choices:["3776 meter","634 meter","1882 meter","100 meter"],explain:"3776 m gjør Fuji til Japans høyeste fjell. 634 m er høyden på Tokyo Skytree, ikke fjellet."},{id:"dest-fuji-03",tema:"Fuji-san",prompt:"Fuji-san er:",choices:["en vulkan som nå er i ro","en ørken","en innsjø","et lyntog"],explain:"富士山 er en vulkan. Den har vært i ro i lang tid, og er et viktig symbol i kunst og bilder."},{id:"dest-fuji-04",tema:"Fuji-san",prompt:"Når er de vanlige klatre-løypene typisk åpne?",choices:["om sommeren, typisk i juli og august","bare i desember","bare om natten hele året","aldri, det er forbudt"],explain:"Sesongen er kort. Utenom den bør du ikke regne med åpne hytter og merkede hovedløyper."},{id:"dest-fuji-05",tema:"Fuji-san",prompt:"Hvordan sier du «fjell» på japansk?",choices:[{jp:"やま",ro:"yama",kanji:"山"},{jp:"かわ",ro:"kawa"},{jp:"うみ",ro:"umi"},{jp:"もり",ro:"mori"}],explain:"山 (やま) = fjell. Det er det siste tegnet i 富士山."},{id:"dest-fuji-06",tema:"Fuji-san",prompt:"På klare dager kan du ofte se Fuji fra:",choices:["lyntoget mellom Tokyo og Kyoto eller Osaka","inne i en t-banetunnel","bunnen av et svømmebasseng","Okinawa-jungelen"],explain:"Sitt på den rette siden og se ut når det er opphold. Skyer skjuler toppen ofte, så det er heldig når den vises."},{id:"dest-fuji-07",tema:"Fuji-san",prompt:"Hvordan sier du «Jeg skal til Fuji-san»?",choices:[{jp:"ふじさんに いきます。",ro:"Fuji-san ni ikimasu."},{jp:"ふじさんを たべます。",ro:"Fuji-san o tabemasu."},{jp:"ふじさんは ねこです。",ro:"Fuji-san wa neko desu."},{jp:"ふじさんから ねます。",ro:"Fuji-san kara nemasu."}],explain:"に いきます = skal til. Mange bor i nærheten, for eksempel i Hakone, og ser på fjellet derfra."},{id:"dest-fuji-08",tema:"Fuji-san",prompt:"Hva betyr 山 i 富士山?",choices:["fjell","hav","sol","te"],explain:"山 = fjell. 富士 er navnet, 山 forteller at det er et fjell."},{id:"dest-fuji-09",tema:"Fuji-san",prompt:"Fuji-san står på listen til:",choices:["UNESCO (verdensarv)","FIFA som fotballstadion","Kōdōkan som dojo","Den internasjonale romstasjonen"],explain:"Fjellet er verdensarv, både som natur og som kulturlandskap rundt."}]},
  {id:"hakone",name:"Hakone",jp:"はこね",kanji:"箱根",ro:"Hakone",icon:"♨️",journey:false,sub:"Onsen og utsikt til Fuji",facts:["Hakone er et fjellområde sør-vest for Tokyo, kjent for varme kilder (おんせん).","Fra innsjøen Ashinoko kan du på klare dager se Fuji-san. Der går også sightseeing-båter.","Hakone-helligdommen har en rød torii som står i vannet ved innsjøen.","I Ōwakudani kokes egg i den varme kilden, og skallet blir svart. De kalles kuro-tamago.","Hakone lå ved den gamle Tōkaidō-veien mellom Edo (Tokyo) og Kyoto, med en kjent kontrollpost.","Utendørsmuseet i Hakone har skulpturer i en park med fjell rundt."],words:[{no:"Hakone",jp:"はこね",kanji:"箱根",ro:"Hakone"},{no:"varm kilde",jp:"おんせん",kanji:"温泉",ro:"onsen"},{no:"innsjø",jp:"みずうみ",kanji:"湖",ro:"mizuumi"},{no:"egg",jp:"たまご",kanji:"卵",ro:"tamago"},{no:"varmt (vann/mat)",jp:"あつい",kanji:"熱い",ro:"atsui"}],questions:[{id:"dest-hakone-01",tema:"Hakone",prompt:"Hvordan skrives Hakone med kanji?",choices:[{jp:"はこね",ro:"Hakone",kanji:"箱根"},{jp:"はこだて",ro:"Hakodate",kanji:"函館"},{jp:"にっこう",ro:"Nikkō",kanji:"日光"},{jp:"かまくら",ro:"Kamakura",kanji:"鎌倉"}],explain:"箱根 = Hakone. Et fjellområde kjent for onsen og utsikt til Fuji."},{id:"dest-hakone-02",tema:"Hakone",prompt:"Hakone er spesielt kjent for:",choices:[{jp:"おんせん",ro:"onsen",kanji:"温泉"},{jp:"ゆきまつり",ro:"yukimatsuri"},{jp:"からて",ro:"karate"},{jp:"たこやき",ro:"takoyaki"}],explain:"温泉 = varm kilde / innendørs eller utendørs bad med naturlig varmt vann. Hakone er fullt av slike steder."},{id:"dest-hakone-03",tema:"Hakone",prompt:"Innsjøen i Hakone heter:",choices:["Ashinoko (Lake Ashi)","Chūzenji","Biwa","Tōkyō-ko"],explain:"芦ノ湖 (Ashinoko) er innsjøen der sightseeing-båtene går. På klare dager speiler Fuji seg i vannet."},{id:"dest-hakone-04",tema:"Hakone",prompt:"Kuro-tamago i Hakone er:",choices:["egg kokt i en varm kilde, med svart skall","en type belte i judo","et lyntog","en iskrem"],explain:"くろたまご kokes i Ōwakudani. Skallet blir svart av kilden, mens inni er det et vanlig egg."},{id:"dest-hakone-05",tema:"Hakone",prompt:"Hvordan sier du «varm kilde»?",choices:[{jp:"おんせん",ro:"onsen",kanji:"温泉"},{jp:"れいぞうこ",ro:"reizōko"},{jp:"プール",ro:"pūru"},{jp:"かざん",ro:"kazan"}],explain:"温 = varm, 泉 = kilde. おんせん er både selve kilden og badeplassen."},{id:"dest-hakone-06",tema:"Hakone",prompt:"Hakone-helligdommen er kjent for:",choices:["en rød torii som står i vannet ved innsjøen","en innendørs skøytebane","Kōdōkan","Tokyo Skytree"],explain:"Porten i vannet er et yndet fotomotiv, litt på samme måte som torii-en ved Miyajima – men her er det en innsjø."},{id:"dest-hakone-07",tema:"Hakone",prompt:"Hvordan sier du «Jeg skal til Hakone»?",choices:[{jp:"はこねに いきます。",ro:"Hakone ni ikimasu."},{jp:"はこねを たべます。",ro:"Hakone o tabemasu."},{jp:"はこねは いぬです。",ro:"Hakone wa inu desu."},{jp:"はこねから ねます。",ro:"Hakone kara nemasu."}],explain:"に いきます = skal til. Mange reiser fra Tokyo for å bade og se på Fuji."},{id:"dest-hakone-08",tema:"Hakone",prompt:"Utendørsmuseet i Hakone er:",choices:["en park med skulpturer og fjell rundt","et fiskemarked","en flyplass","et svømmeanlegg under bakken"],explain:"Hakone Open-Air Museum viser skulpturer utendørs. Fint å gå der når været er pent."},{id:"dest-hakone-09",tema:"Hakone",prompt:"Før i tiden lå Hakone ved:",choices:["Tōkaidō-veien mellom Edo (Tokyo) og Kyoto","en skiheis til Sapporo","en bro til Okinawa","Kōdōkan-porten"],explain:"Der sto en kontrollpost. Reisende mellom den gamle hovedstaden og Edo måtte innom Hakone."}]},
  {id:"nagoya",name:"Nagoya",jp:"なごや",kanji:"名古屋",ro:"Nagoya",icon:"🐯",journey:false,sub:"Slottet med de gylne fiskene",facts:["Nagoya er en av Japans største byer og ligger midt mellom Tokyo og Osaka, med lyntog-stopp.","På taket av Nagoya-jø (名古屋城) sitter gylne shachihoko – fabeldyr som er halvparten tiger og halvparten fisk.","Området rundt Nagoya er kjent for bilindustri. Toyota-byen ligger i nærheten, i Aichi.","Hitsumabushi er en kjent lokal rett: ål på ris, som ofte spises i flere runder.","Andre typiske smaker er miso-katsu (schnitzel med miso-saus), kishimen-nudler og tebasaki (kyllingvinger).","Byen er et knutepunkt i midten av hovedøya Honshū."],words:[{no:"Nagoya",jp:"なごや",kanji:"名古屋",ro:"Nagoya"},{no:"slott",jp:"しろ",kanji:"城",ro:"shiro"},{no:"Nagoya-slottet",jp:"なごやじょう",kanji:"名古屋城",ro:"Nagoyajō"},{no:"tog / lyntog",jp:"しんかんせん",kanji:"新幹線",ro:"shinkansen"},{no:"ris",jp:"ごはん",kanji:"ご飯",ro:"gohan"}],questions:[{id:"dest-nagoya-01",tema:"Nagoya",prompt:"Hvordan skrives Nagoya med kanji?",choices:[{jp:"なごや",ro:"Nagoya",kanji:"名古屋"},{jp:"おおさか",ro:"Ōsaka",kanji:"大阪"},{jp:"かなざわ",ro:"Kanazawa",kanji:"金沢"},{jp:"はこね",ro:"Hakone",kanji:"箱根"}],explain:"名古屋 = Nagoya, en av de største byene, midt mellom Tokyo og Osaka."},{id:"dest-nagoya-02",tema:"Nagoya",prompt:"På taket av Nagoya-slottet sitter:",choices:["gylne shachihoko (tiger-fisk)","en skiheis","en kjempe-lykt fra Asakusa","en judodrakt"],explain:"しゃちほこ er fabeldyr som skulle beskytte slottet mot brann. De gylne figurene er byens kjennemerke."},{id:"dest-nagoya-03",tema:"Nagoya",prompt:"Nagoya-slottet heter på japansk:",choices:[{jp:"なごやじょう",ro:"Nagoyajō",kanji:"名古屋城"},{jp:"おおさかじょう",ro:"Ōsakajō"},{jp:"しろやま",ro:"Shiroyama"},{jp:"やましろ",ro:"Yamashiro"}],explain:"城 (じょう) = slott når det står bak navnet. 名古屋城 ligger i en park i byen."},{id:"dest-nagoya-04",tema:"Nagoya",prompt:"Området rundt Nagoya er særlig kjent for:",choices:["bilindustri (Toyota ligger i nærheten)","alpin-ski i sentrum","keiserpalasset","Snøfestivalen"],explain:"Toyota-byen ligger i Aichi, ikke langt unna. Nagoya er et viktig industrisenter."},{id:"dest-nagoya-05",tema:"Nagoya",prompt:"Hitsumabushi er en kjent Nagoya-rett med:",choices:["ål på ris, ofte spist i flere runder","bare is og bær","takoyaki-kuler","suppe av is"],explain:"Du spiser gjerne først som den er, så med krydder, og til slutt med te eller suppe over risen."},{id:"dest-nagoya-06",tema:"Nagoya",prompt:"Nagoya ligger:",choices:["mellom Tokyo og Osaka, med lyntog-stopp","på Okinawa","nord for Sapporo","inne i Nara-parken"],explain:"Shinkansen stopper i Nagoya. Det er et naturlig stopp midt på Honshū."},{id:"dest-nagoya-07",tema:"Nagoya",prompt:"Hvordan sier du «Jeg skal til Nagoya»?",choices:[{jp:"なごやに いきます。",ro:"Nagoya ni ikimasu."},{jp:"なごやを のみます。",ro:"Nagoya o nomimasu."},{jp:"なごやは いすです。",ro:"Nagoya wa isu desu."},{jp:"なごやから ねます。",ro:"Nagoya kara nemasu."}],explain:"に いきます = skal til."},{id:"dest-nagoya-08",tema:"Nagoya",prompt:"Tebasaki, en typisk Nagoya-mat, er:",choices:["krydrede kyllingvinger","en type lyntog","et slottstårn","en helligdomsport"],explain:"手羽先 (tebasaki) er kyllingvinger, ofte sprø og lett søt-sterke. En typisk smak fra byen."},{id:"dest-nagoya-09",tema:"Nagoya",prompt:"Hvordan sier du «slott» når det står i navn som 名古屋城?",choices:[{jp:"じょう",ro:"jō",kanji:"城"},{jp:"やま",ro:"yama"},{jp:"かわ",ro:"kawa"},{jp:"うみ",ro:"umi"}],explain:"I stedsnavn leses 城 ofte じょう. Et slott alene kan også leses しろ."}]},
  {id:"kanazawa",name:"Kanazawa",jp:"かなざわ",kanji:"金沢",ro:"Kanazawa",icon:"🥇",journey:false,sub:"Hagebyen med bladgull",facts:["Kanazawa ligger mot Japanhavet, i Ishikawa, og er kjent for at mange gamle gater er bevart.","Kenroku-en er en av Japans tre mest berømte hager, med dammer, broer og steiner.","Byen er kjent for bladgull (きんぱく). Det brukes på porselen, pynt og av og til på mat.","Nagamachi er et gammelt samurai-strøk, og Higashi Chaya er et tehus-strøk med trehus.","Kanazawa-jø (金沢城) ligger like ved Kenroku-en.","Navnet 金沢 inneholder kanji for gull: 金."],words:[{no:"Kanazawa",jp:"かなざわ",kanji:"金沢",ro:"Kanazawa"},{no:"gull",jp:"きん",kanji:"金",ro:"kin"},{no:"bladgull",jp:"きんぱく",kanji:"金箔",ro:"kinpaku"},{no:"hage",jp:"にわ",kanji:"庭",ro:"niwa"},{no:"slott",jp:"しろ",kanji:"城",ro:"shiro"}],questions:[{id:"dest-kanazawa-01",tema:"Kanazawa",prompt:"Hvordan skrives Kanazawa med kanji?",choices:[{jp:"かなざわ",ro:"Kanazawa",kanji:"金沢"},{jp:"かまくら",ro:"Kamakura",kanji:"鎌倉"},{jp:"かなざき",ro:"Kanazaki"},{jp:"かわさき",ro:"Kawasaki",kanji:"川崎"}],explain:"金沢 = Kanazawa. 金 betyr gull."},{id:"dest-kanazawa-02",tema:"Kanazawa",prompt:"Kenroku-en i Kanazawa er:",choices:["en av Japans tre mest berømte hager","et lyntog","en judohall","en flyplass"],explain:"兼六園 (Kenroku-en) har dammer, broer og nøye satt stein og trær. Den skifter preg gjennom året."},{id:"dest-kanazawa-03",tema:"Kanazawa",prompt:"Kanazawa er kjent for きんぱく. Hva er det?",choices:["bladgull, brukt på pynt og av og til på mat","en type ramen","et judokast","en skibakke"],explain:"金箔 = bladgull. Byen har lange tradisjoner med å slå gull tynt og bruke det til kunst og håndverk."},{id:"dest-kanazawa-04",tema:"Kanazawa",prompt:"Hva betyr 金 i navnet 金沢?",choices:["gull","vann","tre","vind"],explain:"金 (きん) = gull. Derfor er bladgull et passende kjennemerke for byen."},{id:"dest-kanazawa-05",tema:"Kanazawa",prompt:"Nagamachi og Higashi Chaya er kjent for:",choices:["gamle samurai- og tehus-gater som er bevart","en innendørs alpinebane","Tokyo Skytree","Kōdōkan"],explain:"Mange gamle gater i Kanazawa er bevart, og det gir byen et roligere, eldre preg enn mange storbyer."},{id:"dest-kanazawa-06",tema:"Kanazawa",prompt:"Hvordan sier du «hage» på japansk?",choices:[{jp:"にわ",ro:"niwa",kanji:"庭"},{jp:"うみ",ro:"umi"},{jp:"やたい",ro:"yatai"},{jp:"きっぷ",ro:"kippu"}],explain:"庭 (にわ) = hage. Kenroku-en er nettopp en stor, klassisk hage."},{id:"dest-kanazawa-07",tema:"Kanazawa",prompt:"Hvordan sier du «Jeg skal til Kanazawa»?",choices:[{jp:"かなざわに いきます。",ro:"Kanazawa ni ikimasu."},{jp:"かなざわを たべます。",ro:"Kanazawa o tabemasu."},{jp:"かなざわは いぬです。",ro:"Kanazawa wa inu desu."},{jp:"かなざわから ねます。",ro:"Kanazawa kara nemasu."}],explain:"に いきます = skal til. Lyntoget Hokuriku shinkansen går hit fra Tokyo."},{id:"dest-kanazawa-08",tema:"Kanazawa",prompt:"Kanazawa-slottet ligger:",choices:["like ved hagen Kenroku-en","på toppen av Fuji","inne i Dōtonbori","på Miyajima"],explain:"金沢城 og Kenroku-en hører sammen som et par midt i byen."},{id:"dest-kanazawa-09",tema:"Kanazawa",prompt:"Hvordan sier du «gull»?",choices:[{jp:"きん",ro:"kin",kanji:"金"},{jp:"ぎん",ro:"gin"},{jp:"みず",ro:"mizu"},{jp:"き",ro:"ki"}],explain:"金 = gull, 銀 = sølv. 金箔 er bladgull."}]},

const KANA_TOKENS = new Set(["しません","しませんか","です","ます","ですか","ですね","ですよ","でした","ますか","ません","ましょう","ました","します","しました","しましょう","して","しない","しますか","います","いました","いますか","ください","くださいね","いただきます","いただきました","ございます","ございました","すみません","すみませんでした","さようなら","こんにちは","こんばんは","おはよう","おはようございます","いらっしゃいませ","どういたしまして","おつかれさまでした","ごちそうさまでした","ただいま","おやすみ","おやすみなさい","ごめんなさい","よろしく","どうぞ","どうも","はい","いいえ","あれ","これ","それ","どれ","ここ","そこ","あそこ","どこ","いつ","もう","まだ","とても","ちょっと","ゆっくり","やっぱり","ぜひ"]);
const KANJI_SUFFIXES = ["たくないです","たいです","くないです","くない","くて","でした","でしたか","ですよ","ですね","ですか","です","ましょう","ました","ますか","ません","ます","から","まで","より"];
const KANJI_PARTICLES = new Set("はがをにでとものかねよへもわ".split(""));
function isKanaChar(ch){ if(!ch) return false; const o=ch.codePointAt(0); return (o>=0x3040&&o<=0x30FF)||ch==="ー"||ch==="・"; }
function rubyWord(kana, kanji){
  if(kana.startsWith("お") && kanji.startsWith("お") && kanji.length>1 && kana.length>1 && !isKanaChar(kanji[1])){
    return "お"+rubyWord(kana.slice(1), kanji.slice(1));
  }
  let i=0;
  while(i<kana.length && i<kanji.length && kana[kana.length-1-i]===kanji[kanji.length-1-i] && isKanaChar(kanji[kanji.length-1-i])) i++;
  if(i>0 && i<kanji.length){
    const stemK=kanji.slice(0,-i), stemR=kana.slice(0,-i), oku=kanji.slice(-i);
    if(stemK && stemR) return `<ruby>${esc(stemK)}<rt>${esc(stemR)}</rt></ruby>${esc(oku)}`;
  }
  return `<ruby>${esc(kanji)}<rt>${esc(kana)}</rt></ruby>`;
}
function splitPunct(s){
  const marks="。、！？!?…「」『』・ ";
  let i=0, lead="", trail="";
  while(i<s.length && marks.includes(s[i])){ lead+=s[i]; i++; }
  s=s.slice(i);
  i=s.length;
  while(i>0 && marks.includes(s[i-1])) i--;
  return [lead, s.slice(0,i), s.slice(i)];
}
function prefixOk(tok){
  if(!tok) return true;
  if(KANA_TOKENS.has(tok) || KANJI_DICT[tok]) return true;
  for(const k of KANJI_KEYS){ if(tok.startsWith(k) && validRest(tok.slice(k.length))) return true; }
  return false;
}
function validRest(rest){
  if(rest==="") return true;
  if(KANA_TOKENS.has(rest) || KANJI_DICT[rest]) return true;
  for(const suf of KANJI_SUFFIXES){
    if(rest===suf) return true;
    if(rest.startsWith(suf) && validRest(rest.slice(suf.length))) return true;
    if(rest.endsWith(suf) && validRest(rest.slice(0,-suf.length))) return true;
  }
  if(KANJI_PARTICLES.has(rest[0]) && validRest(rest.slice(1))) return true;
  return prefixOk(rest);
}
function annotateToken(tok){
  if(!tok) return tok;
  if(KANA_TOKENS.has(tok)) return esc(tok);
  if(KANJI_DICT[tok]) return rubyWord(tok, KANJI_DICT[tok]);
  for(const k of KANJI_KEYS){
    if(tok.startsWith(k) && validRest(tok.slice(k.length))){
      return rubyWord(k, KANJI_DICT[k]) + annotateToken(tok.slice(k.length));
    }
  }
  return esc(tok);
}
function dictAnnotate(text){
  return String(text).split(/([ 　、。！？!?,/])/).map(p=>{
    if(!p || /^[ 　、。！？!?,/]+$/.test(p)) return p;
    const [lead,core,trail]=splitPunct(p);
    return esc(lead)+annotateToken(core)+esc(trail);
  }).join("");
}
function kanjiOn(){ return S.kanji!==false; }
function jpTextHTML(kana, kanji, hideKanji){
  if(!kana) return "";
  if(hideKanji || !kanjiOn()) return esc(kana);
  if(kanji){
    const [lead,core,trail]=splitPunct(kana);
    const kcore=splitPunct(kanji)[1];
    if(!core.includes(" ") && kcore && !kcore.includes(" ") && !kcore.includes("。")){
      return esc(lead)+rubyWord(core,kcore)+esc(trail);
    }
  }
  return dictAnnotate(kana);
}
function mixHTML(s){
  if(s==null || s==="") return "";
  s=String(s);
  if(!kanjiOn()) return esc(s);
  const re=/[\u3040-\u30ff\u4e00-\u9faf々ー]+/g;
  let out="", last=0, m;
  while((m=re.exec(s))){
    out+=esc(s.slice(last,m.index));
    out+=dictAnnotate(m[0]);
    last=m.index+m[0].length;
  }
  return out+esc(s.slice(last));
}

function addDays(s,n){ const [y,m,d]=s.split("-").map(Number); const t=Date.UTC(y,m-1,d)+n*86400000; const x=new Date(t); return x.getUTCFullYear()+"-"+String(x.getUTCMonth()+1).padStart(2,"0")+"-"+String(x.getUTCDate()).padStart(2,"0"); }

/* --- spørsmålsbyggere --- */
function fromCustom(q){
  const correct = q.choices[0];
  const choices = shuffle(q.choices);
  return { tema:q.tema||"", prompt:q.prompt, show:q.show||null, hideRo:!!q.hideRo, choices, answer:choices.indexOf(correct), explain:q.explain||"" };
}
function vocabQuestion(pool, w, tema){
  const others = shuffle(pool.filter(x=>x!==w && x.no!==w.no && x.jp!==w.jp)).slice(0,3);
  if(others.length<3) return null;
  if(Math.random()<.5){
    const choices = shuffle([w, ...others]).map(x=>x.no);
    return { tema, prompt:"Hva betyr dette ordet?", show:w, choices, answer:choices.indexOf(w.no), explain:`${w.jp}${w.kanji?" ("+w.kanji+")":""} = ${w.no}` };
  } else {
    const choices = shuffle([w, ...others]).map(x=>({jp:x.jp, ro:x.ro, kanji:x.kanji}));
    return { tema, prompt:`Hva er «${w.no}» på japansk?`, show:null, choices, answer:choices.findIndex(c=>c.jp===w.jp), explain:`${w.no} = ${w.jp}${w.kanji?" ("+w.kanji+")":""}, uttales «${w.ro}».` };
  }
}
function kanaQuestion(){
  const [k,r] = pick(KANA_WORDS);
  const others = shuffle(KANA_WORDS.filter(x=>x[1]!==r)).slice(0,3).map(x=>x[1]);
  const choices = shuffle([r, ...others]);
  return { tema:"Kana", prompt:"Les ordet! Hvordan uttales det?", show:{jp:k}, hideRo:true, choices, answer:choices.indexOf(r), explain:`${k} = ${r}` };
}
const UNIT_EXP = { mm:0, cm:1, dm:2, m:3, km:6 };
function lengthQuestion(fact){
  const units = Object.keys(UNIT_EXP).filter(u=>u!==fact.u && Math.abs(UNIT_EXP[u]-UNIT_EXP[fact.u])<=3);
  let target, val;
  for(let tries=0; tries<20; tries++){
    target = pick(units);
    val = Number((fact.v*Math.pow(10, UNIT_EXP[fact.u]-UNIT_EXP[target])).toPrecision(12));
    if(val>=0.001 && val<=10000000) break;
  }
  const cands = [val*10, val/10, val*100, val/100, val*1000, val/1000].map(x=>Number(x.toPrecision(12)));
  const wrong = shuffle([...new Set(cands)].filter(x=>x!==val && x>=0.0001)).slice(0,3);
  const opts = shuffle([val, ...wrong]);
  const choices = opts.map(x=>fmt(x)+" "+target);
  const factor = Math.pow(10, Math.abs(UNIT_EXP[fact.u]-UNIT_EXP[target]));
  const how = UNIT_EXP[fact.u] > UNIT_EXP[target] ? `ganger med ${fmt(factor)}` : `deler på ${fmt(factor)}`;
  return { tema:"Lengder", prompt: fact.text.replace("{v}", fmt(fact.v)).replace("{u}", fact.u) + ` Hvor mange ${target} er det?`,
    show:null, choices, answer:opts.indexOf(val),
    explain:`Fra ${fact.u} til ${target}: du ${how}. ${fmt(fact.v)} ${fact.u} = ${fmt(val)} ${target}.` };
}
function weekQuestion(){
  const w = W(); const r = Math.random();
  if(r<.3 && w.lengths && w.lengths.length) return lengthQuestion(pick(w.lengths));
  if(r<.6 && w.vocab && w.vocab.length>=4){ const v=pick(w.vocab); const q=vocabQuestion(w.vocab, v, v.tema||"Ukens ord"); if(q) return q; }
  if(w.questions && w.questions.length) return fromCustom(pick(w.questions));
  return vocabQuestion(GENERAL_VOCAB, pick(GENERAL_VOCAB), "Ord");
}
function generalQuestion(){
  return Math.random()<.5 ? kanaQuestion() : vocabQuestion(GENERAL_VOCAB, pick(GENERAL_VOCAB), "Ord");
}
function keyOf(q){ return q.prompt + "|" + (q.show? q.show.jp : "") + "|" + q.choices.map(c=>typeof c==="string"?c:c.jp).sort().join(","); }
function buildQuestions(stopIdx, mode){
  const list=[], seen=new Set();
  const add = q => { if(!q) return false; const k=keyOf(q); if(seen.has(k)) return false; seen.add(k); list.push(q); return true; };
  if(mode==="week"){
    let guard=0; while(list.length<12 && guard++<200) add(weekQuestion());
  } else {
    shuffle(STOPS[stopIdx].questions).forEach(q=>add(fromCustom(q)));          // 4 praktiske situasjoner fra byen
    let guard=0; while(list.length<9 && guard++<200) add(weekQuestion());      // 5 fra ukens tema
    guard=0; while(list.length<12 && guard++<200) add(generalQuestion());      // 3 ord/kana
  }
  return shuffle(list);
}

/* --- Dagens utfordring: datostyrt utvalg --- */
function hashStr(s){
  let h = 2166136261;
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function rngFrom(seed){
  let a = seed >>> 0;
  return function(){
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffleSeeded(arr, rand){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(rand()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function parseDay(s){ const [y,m,d]=s.split("-").map(Number); return Date.UTC(y,m-1,d); }
function pruneDailyHistory(hist, today){
  const keep = {};
  const t = parseDay(today);
  Object.keys(hist||{}).forEach(d=>{
    const diff = (t - parseDay(d))/86400000;
    if(diff>=0 && diff<=21) keep[d]=hist[d];
  });
  return keep;
}
function usedIdsLastDays(hist, today, days){
  const used = new Set();
  const t = parseDay(today);
  Object.keys(hist||{}).forEach(d=>{
    if(d===today) return;
    const diff = (t - parseDay(d))/86400000;
    if(diff>0 && diff<=days) (hist[d]||[]).forEach(id=>used.add(id));
  });
  return used;
}
function allQuestionMap(){
  const m={};
  DAILY_POOL.forEach(q=>{ m[q.id]=q; });
  PLACES.forEach(p=> (p.questions||[]).forEach(q=>{ m[q.id]=q; }));
  return m;
}
function pickDailyIds(dateStr, history, placeId){
  const used = usedIdsLastDays(history, dateStr, DAILY_COOLDOWN_DAYS);
  const rand = rngFrom(hashStr("daily-"+dateStr+(placeId?"-"+placeId:"")));
  const picked=[], seen=new Set();
  if(placeId && placeOf(placeId)){
    const dqs = placeOf(placeId).questions||[];
    let avail = dqs.filter(q=>!used.has(q.id));
    if(avail.length<DEST_N) avail = dqs.slice();
    shuffleSeeded(avail, rand).slice(0, DEST_N).forEach(q=>{ picked.push(q.id); seen.add(q.id); });
  }
  const need = DAILY_N - picked.length;
  let pool = DAILY_POOL.filter(q=>!used.has(q.id) && !seen.has(q.id));
  if(pool.length < need){
    const last = {};
    Object.keys(history||{}).forEach(d=>{
      if(d===dateStr) return;
      (history[d]||[]).forEach(id=>{ if(!last[id] || d>last[id]) last[id]=d; });
    });
    pool = DAILY_POOL.filter(q=>!seen.has(q.id)).slice().sort((a,b)=>{
      const da=last[a.id]||"0000", db=last[b.id]||"0000";
      if(da!==db) return da<db ? -1 : 1;
      return a.id<b.id ? -1 : 1;
    });
  }
  const byCat = {};
  pool.forEach(q=>{ (byCat[q.tema]=byCat[q.tema]||[]).push(q); });
  const cats = shuffleSeeded(Object.keys(byCat), rand);
  for(const c of cats){
    if(picked.length>=DAILY_N) break;
    const cand = shuffleSeeded(byCat[c], rand).find(q=>!seen.has(q.id));
    if(cand){ picked.push(cand.id); seen.add(cand.id); }
  }
  const rest = shuffleSeeded(pool.filter(q=>!seen.has(q.id)), rand);
  for(const q of rest){
    if(picked.length>=DAILY_N) break;
    picked.push(q.id); seen.add(q.id);
  }
  return shuffleSeeded(picked, rand);
}
function wishPlaceFor(dateStr){
  return (S.wish && S.wish.forDate===dateStr && S.wish.placeId) ? S.wish.placeId : null;
}
function getTodayDaily(dateStr){
  if(S.dailyDate===dateStr && Array.isArray(S.dailyIds) && S.dailyIds.length===DAILY_N) return S.dailyIds;
  S.dailyHistory = pruneDailyHistory(S.dailyHistory||{}, dateStr);
  const placeId = wishPlaceFor(dateStr);
  const ids = pickDailyIds(dateStr, S.dailyHistory, placeId);
  S.dailyDate = dateStr;
  S.dailyIds = ids;
  S.dailyPlace = placeId;
  S.dailyHistory[dateStr] = ids;
  save();
  return ids;
}
function dailyQsFor(dateStr){
  const byId = allQuestionMap();
  return getTodayDaily(dateStr).map(id=>fromCustom(byId[id])).filter(Boolean);
}

            <span class="tag">${tag}</span></li>`; }).join("")}
      </ul>
      <p class="muted maphint">Trykk på en by for å lese mer om den.</p>
    </div>
    <button class="btn" id="btnFight">${allDone ? "🏆 Kjemp igjen i Sapporo" : `🥋 Kjemp i ${esc(STOPS[nextIdx].name)}`}</button>
    <button class="btn alt" id="btnWeek">📚 Ukens trening (${esc(w.label)})</button>
    <div class="card weekbox">
      <h3>Ukens tema i spillet</h3>
      <div class="chips">${(w.topics||[]).map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div>
    </div>
    <p class="muted" style="text-align:center">Riktig svar = わざあり (waza-ari). 2 waza-ari = いっぽん (ippon).<br>Først til 3 ippon vinner kampen. Vinn en by → nytt belte!</p>
  `;
  $("#btnFight").onclick = ()=> startMatch(allDone ? STOPS.length-1 : nextIdx, "stop");
  $("#btnWeek").onclick = ()=> startMatch(null, "week");
  const bd = $("#btnDaily"); if(bd) bd.onclick = ()=> startDaily(false);
  const br = $("#btnDailyReplay"); if(br) br.onclick = ()=> startDaily(true);
  const bw = $("#btnWish"); if(bw) bw.onclick = ()=> renderWish();
  app.querySelectorAll(".stop").forEach(el=>el.onclick=()=>{ const i=+el.dataset.stop; if(i>=0 && i<STOPS.length) renderPlaceInfo(STOPS[i].id, renderHome); });
  window.scrollTo(0,0);
}

let M = null; // aktiv kamp
function startMatch(stopIdx, mode){
  const opp = mode==="week" ? { name:"Sensei", jp:"せんせい", ava:"👩‍🏫" } : STOPS[stopIdx].opp;
  M = { stopIdx, mode, opp, qs:buildQuestions(stopIdx, mode), qi:0, me:0, them:0, run:0, gained:0, startedAt:Date.now() };
  renderQuestion();
}
function pips(waza){ const ip=Math.floor(waza/2), half=waza%2; return "●".repeat(ip)+(half?"◐":"")+"○".repeat(Math.max(0,3-ip-half)); }
function renderQuestion(){
  const q = M.qs[M.qi % M.qs.length];
  const where = M.mode==="week" ? "Ukens trening" : `${STOPS[M.stopIdx].name} ${STOPS[M.stopIdx].kanji}`;
  const hideRo = !!q.hideRo;
  app.innerHTML = `
    <div class="topline"><button class="iconbtn" id="btnQuit" aria-label="Avslutt">✖</button><b>${esc(where)}</b></div>
    <div class="scoreboard">
      <div class="fighter blue"><div class="ava" id="avaMe">🥋</div><div class="nm">Harald</div><div class="pips" id="pipsMe">${pips(M.me)}</div></div>
      <div class="vs">VS</div>
      <div class="fighter"><div class="ava" id="avaThem">${M.opp.ava}</div><div class="nm">${esc(M.opp.name)} <span class="jp">${esc(M.opp.jp)}</span></div><div class="pips" id="pipsThem">${pips(M.them)}</div></div>
    </div>
    <div class="progress"><i style="width:${Math.min(100,(M.me/6)*100)}%"></i></div>
    <div class="card">
      <div class="qmeta"><span class="badge">${esc(q.tema||"Japansk")}</span><span>Spørsmål ${M.qi+1}</span></div>
      <div class="prompt">${mixHTML(q.prompt)}</div>
      ${q.show ? `<div class="show">${jpHTML(q.show, hideRo)}${speakBtn(q.show.jp)}</div>` : ""}
      <div class="choices">
        ${q.choices.map((c,i)=>`<button class="choice" data-i="${i}">${choiceHTML(c, hideRo)}</button>`).join("")}
      </div>
      <div class="feedback" id="fb"></div>
    </div>`;
  $("#btnQuit").onclick = ()=>{ if(confirm("Avslutte kampen?")) renderHome(); };
  app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  bindSpeak();
  window.scrollTo(0,0);
}
function bindSpeak(){ app.querySelectorAll("[data-say]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); speak(b.dataset.say); }); }
function flash(html){ const c=$("#call"); c.innerHTML=html; c.classList.add("on"); setTimeout(()=>c.classList.remove("on"), 900); }
function answer(i){
  const q = M.qs[M.qi % M.qs.length];
  const ok = i===q.answer;
  const btns = app.querySelectorAll(".choice");
  btns.forEach((b,j)=>{ b.disabled=true; if(j===q.answer) b.classList.add("right"); else if(j===i) b.classList.add("wrong"); });
  S.answered++;
  if(ok){
    S.correct++; M.me++; M.run++;
    let pts = 10 + (M.run>=3 ? 5 : 0); M.gained += pts;
    $("#avaThem").classList.add("thrown");
    flash(M.me%2===0 ? `いっぽん!<small>Ippon! +${pts}</small>` : `わざあり!<small>Waza-ari! +${pts}</small>`);
  } else {
    M.them++; M.run=0;
    $("#avaMe").classList.add("thrown");
    app.querySelector(".card").classList.add("shake");
  }
  $("#pipsMe").textContent=pips(M.me); $("#pipsThem").textContent=pips(M.them);
  app.querySelector(".progress i").style.width=Math.min(100,(M.me/6)*100)+"%";
  beep(ok);
  const right = q.choices[q.answer];
  const rightTxt = typeof right==="string" ? esc(right) : jpHTML(right, false);
  const fb = $("#fb");
  fb.className = "feedback " + (ok?"ok":"no");
  const done = M.me>=6 || M.them>=6;
  const sayTxt = typeof right==="string" ? (q.show? q.show.jp : null) : right.jp;
  fb.innerHTML = `<b>${ok? "✅ Riktig! " + pick(["すごい!","いいね!","やった!","かんぺき!"]) : "❌ Ikke helt."}</b>
    ${ok?"":`<div style="margin-top:6px">Riktig svar: ${rightTxt}</div>`}
    ${q.explain?`<div style="margin-top:6px">💡 ${mixHTML(q.explain)}</div>`:""}
    ${sayTxt?`<div style="margin-top:6px">Hør: ${speakBtn(sayTxt)}</div>`:""}
    <button class="btn ${ok?"green":"alt"}" id="btnNext" style="margin-top:10px">${done?"Se resultat":"Neste ➜"}</button>`;
  bindSpeak();
  $("#btnNext").onclick = ()=>{ if(done) finishMatch(); else { M.qi++; renderQuestion(); } };
  save();
  fb.scrollIntoView({behavior:"smooth", block:"nearest"});
}
function markPlayedToday(){
  const today=dayStr(); if(S.lastDay===today) return;
  const y=new Date(); y.setDate(y.getDate()-1);
  S.streak = (S.lastDay===dayStr(y)) ? S.streak+1 : 1;
  S.bestStreak = Math.max(S.bestStreak, S.streak);
  S.lastDay = today;
}
function finishMatch(){
  const win = M.me>=6;
  let newBelt=null;
  if(win){ M.gained += 50; if(M.mode==="stop" && M.stopIdx===S.stopsWon && S.stopsWon<STOPS.length){ S.stopsWon++; newBelt=curBelt(); } }
  S.points += M.gained; S.matches++;
  markPlayedToday(); save();
  const secs = Math.round((Date.now()-M.startedAt)/1000);
  const nextName = S.stopsWon<STOPS.length ? STOPS[S.stopsWon].name : null;
  app.innerHTML = `
    <div class="card result">
      <div class="big">${win?"🏆":"🙇"}</div>
      <h2>${win? "Du vant kampen! かった!" : "Denne gangen vant "+esc(M.opp.name)+"."}</h2>
      <p>${win? "Flotte kast, Harald!" : "Ingen fare – alle judoka taper noen ganger. Bukk, si «ありがとうございました», og prøv igjen!"}</p>
      <p><b>+${M.gained} poeng</b> · ${Math.floor(secs/60)} min ${secs%60} s</p>
      ${newBelt?`<div class="card" style="background:#fffbeb"><div style="font-size:1.1rem">Nytt belte! ${beltHTML(newBelt)}</div>
        <div style="margin-top:6px"><b>${esc(newBelt.no)}</b> – <span class="jp">${esc(newBelt.jp)}</span>${S.romaji?` <i class="muted">(${esc(newBelt.ro)})</i>`:""}</div>
        ${nextName?`<div class="muted" style="margin-top:6px">Neste stopp: ${esc(nextName)} (${esc(LEGS[S.stopsWon])})</div>`:`<div style="margin-top:6px">🎌 Du har reist gjennom hele Japan og fått くろおび – svart belte!</div>`}</div>`:""}
      <p class="muted">🔥 ${S.streak} dag(er) på rad · ⭐ ${S.points} poeng totalt</p>
    </div>
    <div class="row">
      <button class="btn ghost" id="btnHome">🗾 Kartet</button>
      <button class="btn" id="btnAgain">${win && M.mode==="stop" && nextName ? "Neste by ➜" : "Prøv igjen"}</button>
    </div>`;
  if(win) beep(true);
  $("#btnHome").onclick = renderHome;
  $("#btnAgain").onclick = ()=>{
    if(M.mode==="week") startMatch(null,"week");
    else if(win && nextName) startMatch(S.stopsWon,"stop");
    else startMatch(M.stopIdx,"stop");
  };
}


let D = null; // dagens utfordring
function startDaily(replay){
  const today = dayStr();
  const already = S.dailyDone===today;
  D = { qs:dailyQsFor(today), qi:0, correct:0, gained:0, run:0, replay: already || !!replay, today, placeId:S.dailyPlace||null, startedAt:Date.now() };
  renderDailyQ();
}
function renderDailyQ(){
  const q = D.qs[D.qi];
  const hideRo = !!q.hideRo;
  const n = D.qs.length;
  app.innerHTML = `
    <div class="topline"><button class="iconbtn" id="btnQuit" aria-label="Avslutt">✖</button><b>⭐ Dagens utfordring</b></div>
    <div class="progress"><i style="width:${(D.qi/n)*100}%"></i></div>
    ${(()=>{ const p=D.placeId&&placeOf(D.placeId); return p?`<div class="wish-banner" style="padding:10px 14px"><b>✈️ I dag reiser du til ${esc(p.name)}!</b> <span class="jp">${jpTextHTML(p.jp,p.kanji,false)}</span></div>`:""; })()}
    <p class="muted" style="text-align:center;margin:0 0 10px">Oppgave ${D.qi+1} av ${n}${D.replay?" · øving (ingen ekstra poeng)":""}</p>
    <div class="card">
      <div class="qmeta"><span class="badge">${esc(q.tema||"Japansk")}</span><span>⭐ I dag</span></div>
      <div class="prompt">${mixHTML(q.prompt)}</div>
      ${q.show ? `<div class="show">${jpHTML(q.show, hideRo)}${speakBtn(q.show.jp)}</div>` : ""}
      <div class="choices">
        ${q.choices.map((c,i)=>`<button class="choice" data-i="${i}">${choiceHTML(c, hideRo)}</button>`).join("")}
      </div>
      <div class="feedback" id="fb"></div>
    </div>`;
  $("#btnQuit").onclick = ()=>{ if(confirm("Avslutte dagens utfordring?")) renderHome(); };
  app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>answerDaily(+b.dataset.i));
  bindSpeak();
  window.scrollTo(0,0);
}
function answerDaily(i){
  const q = D.qs[D.qi];
  const ok = i===q.answer;
  app.querySelectorAll(".choice").forEach((b,j)=>{ b.disabled=true; if(j===q.answer) b.classList.add("right"); else if(j===i) b.classList.add("wrong"); });
  if(!D.replay){ S.answered++; }
  if(ok){
    if(!D.replay) S.correct++;
    D.correct++; D.run++;
    const pts = 10 + (D.run>=3 ? 5 : 0);
    if(!D.replay) D.gained += pts;
    const ptsTxt = D.replay ? "Bra jobba!" : ((D.run>=3 ? "På rad! " : "Riktig! ") + "+"+pts);
    flash((D.run>=3 ? "すごい!" : "やった!") + `<small>${ptsTxt}</small>`);
  } else {
    D.run=0;
    app.querySelector(".card").classList.add("shake");
  }
  beep(ok);
  const right = q.choices[q.answer];
  const rightTxt = typeof right==="string" ? esc(right) : jpHTML(right, false);
  const fb = $("#fb");
  fb.className = "feedback " + (ok?"ok":"no");
  const last = D.qi+1>=D.qs.length;
  const sayTxt = typeof right==="string" ? (q.show? q.show.jp : null) : right.jp;
  fb.innerHTML = `<b>${ok? "✅ Riktig! " + pick(["すごい!","いいね!","やった!","かんぺき!"]) : "❌ Ikke helt."}</b>
    ${ok?"":`<div style="margin-top:6px">Riktig svar: ${rightTxt}</div>`}
    ${q.explain?`<div style="margin-top:6px">💡 ${mixHTML(q.explain)}</div>`:""}
    ${sayTxt?`<div style="margin-top:6px">Hør: ${speakBtn(sayTxt)}</div>`:""}
    <button class="btn ${ok?"green":"alt"}" id="btnNext" style="margin-top:10px">${last?"Se resultat":"Neste ➜"}</button>`;
  bindSpeak();
  $("#btnNext").onclick = ()=>{ if(last) finishDaily(); else { D.qi++; renderDailyQ(); } };
  if(!D.replay) save();
  fb.scrollIntoView({behavior:"smooth", block:"nearest"});
}
function finishDaily(){
  const today=D.today, total=D.qs.length;
  let awarded=0;
  const first = !D.replay && S.dailyDone!==today;
  if(first){
    if(D.correct===total) D.gained += 20;
    awarded = D.gained;
    S.points += awarded;
    S.dailyDone = today;
    S.dailyLast = { date:today, correct:D.correct, total, points:awarded };
    markPlayedToday();
    save();
  }
  const perfect = D.correct===total;
  app.innerHTML = `
    <div class="card result daily-card ${first?"done":""}">
      <div class="big">${perfect?"🌟":"⭐"}</div>
      <h2>${first ? (perfect? "Perfekt i dag! かんぺき!":"Dagens utfordring er ferdig!") : "Øving ferdig!"}</h2>
      <p>${D.correct} av ${total} riktige${first?` · <b>+${awarded} poeng</b>`:" · ingen ekstra poeng"}</p>
      ${first && perfect ? `<p class="muted">Bonus for alle riktige: +20 poeng</p>`:""}
      <p><b>Kom tilbake i morgen for nye oppgaver!</b></p>
      <p class="muted">🔥 ${S.streak} dag(er) på rad · ⭐ ${S.points} poeng totalt</p>
    </div>
    <div class="row">
      <button class="btn ghost" id="btnHome">🗾 Kartet</button>
      <button class="btn gold" id="btnAgain">Prøv igjen (ingen ekstra poeng)</button>
    </div>`;
  if(first && perfect) beep(true);
  $("#btnHome").onclick = renderHome;
  $("#btnAgain").onclick = ()=> startDaily(true);
}



function renderWish(){
  const tom=tomorrowStr();
  const cur=S.wish && S.wish.forDate===tom ? S.wish.placeId : null;
  $("#hdrSub").textContent = "Ønsk reisemål for i morgen";
  app.innerHTML = `
    <div class="topline"><button class="iconbtn" id="back" aria-label="Tilbake">←</button><b>✈️ Reisemål for i morgen</b></div>
    <div class="card">
      <p>Velg hvor du vil «reise» i <b>morgendagens</b> utfordring. Da får du omtrent tre oppgaver om stedet. Trykk ℹ️ for å lese mer.</p>
    </div>
    <div class="placegrid">
      ${PLACES.map(p=>`
        <div class="place ${cur===p.id?"picked":""}" data-id="${p.id}">
          <button class="infoi" data-info="${p.id}" title="Les mer" aria-label="Les mer om ${esc(p.name)}">ℹ️</button>
          <div class="ico">${p.icon}</div>
          <b>${esc(p.name)}</b>
          <div class="jp">${jpTextHTML(p.jp,p.kanji,false)}</div>
          ${S.romaji?`<div class="ro">${esc(p.ro)}</div>`:""}
          <div class="sub">${esc(p.sub||"")}</div>
        </div>`).join("")}
    </div>`;
  $("#back").onclick = renderHome;
  app.querySelectorAll(".infoi").forEach(b=>b.onclick=e=>{ e.stopPropagation(); renderPlaceInfo(b.dataset.info, renderWish); });
  app.querySelectorAll(".place").forEach(el=>el.onclick=()=>{
    const id=el.dataset.id, p=placeOf(id);
    if(!p) return;
    S.wish={ forDate:tom, placeId:id };
    save();
    renderHome();
  });
  window.scrollTo(0,0);
}
function renderPlaceInfo(id, backFn){
  const p=placeOf(id);
  if(!p){ (backFn||renderHome)(); return; }
  const idx=STOPS.findIndex(s=>s.id===p.id);
  const canFight = idx>=0 && idx<=S.stopsWon && idx<STOPS.length;
  $("#hdrSub").textContent = p.name;
  app.innerHTML = `
    <div class="topline"><button class="iconbtn" id="back" aria-label="Tilbake">←</button><b>${p.icon} ${esc(p.name)}</b></div>
    <div class="card" style="text-align:center">
      <div style="font-size:3rem">${p.icon}</div>
      <div class="show" style="margin:6px 0">${jpHTML(p,false)}${speakBtn(p.jp)}</div>
      <p class="muted">${esc(p.sub||"")}</p>
    </div>
    <div class="card">
      <h2>Visste du at …</h2>
      <ul class="facts">${p.facts.map(f=>`<li>${mixHTML(f)}</li>`).join("")}</ul>
    </div>
    <div class="card">
      <h2>Nyttige ord</h2>
      <table class="wordlist">
        ${p.words.map(v=>`<tr><td>${jpHTML(v,false)}</td><td>${esc(v.no)}</td><td style="text-align:right">${speakBtn(v.jp)}</td></tr>`).join("")}
      </table>
    </div>
    ${canFight?`<button class="btn" id="btnFightHere">🥋 Kjemp i ${esc(p.name)}</button>`:""}
    <button class="btn ghost" id="back2">Tilbake</button>`;
  const goBack = ()=> (backFn||renderHome)();
  $("#back").onclick = goBack;
  $("#back2").onclick = goBack;
  const bf=$("#btnFightHere"); if(bf) bf.onclick=()=> startMatch(idx,"stop");
  bindSpeak();
  window.scrollTo(0,0);
}


function renderSettings(){
  const ws = weekNums();
  app.innerHTML = `
    <div class="topline"><button class="iconbtn" id="back" aria-label="Tilbake">←</button><b>Innstillinger</b></div>
    <div class="card">
      <div class="toggle"><span>Vis romaji (latinske bokstaver)</span><label class="switch"><input type="checkbox" id="tRo" ${S.romaji?"checked":""}><span></span></label></div>
      <div class="toggle"><span>Vis kanji (med furigana)</span><label class="switch"><input type="checkbox" id="tKj" ${S.kanji!==false?"checked":""}><span></span></label></div>
      <div class="toggle"><span>Lydeffekter</span><label class="switch"><input type="checkbox" id="tSnd" ${S.sound?"checked":""}><span></span></label></div>
      <div class="toggle"><span>Ukens tema</span><select id="selWeek">
        <option value="">Automatisk (uke ${isoWeek()})</option>
        ${ws.map(w=>`<option value="${w}" ${S.week===w?"selected":""}>${esc(WEEK_CONTENT[w].label)}</option>`).join("")}</select></div>
    </div>
    <div class="card">
      <h2>Statistikk</h2>
      <p class="muted">Kamper: ${S.matches} · Riktige svar: ${S.correct} av ${S.answered} · Lengste streak: ${S.bestStreak} dager</p>
      <p class="muted">Uttale (🔊) bruker enhetens japanske stemme hvis den finnes${jaVoice?" – japansk stemme funnet ✅":"."}</p>
      <button class="btn ghost" id="btnReset">Start på nytt (nullstill alt)</button>
    </div>`;
  $("#back").onclick = renderHome;
  $("#tRo").onchange = e=>{ S.romaji=e.target.checked; save(); };
  $("#tKj").onchange = e=>{ S.kanji=e.target.checked; save(); };
  $("#tSnd").onchange = e=>{ S.sound=e.target.checked; save(); };
  $("#selWeek").onchange = e=>{ S.week = e.target.value ? +e.target.value : null; save(); };
  $("#btnReset").onclick = ()=>{ if(confirm("Er du sikker? Belter, poeng og streak blir slettet.")){ const keep={romaji:S.romaji,sound:S.sound,kanji:S.kanji}; S={...defaultState,...keep}; save(); renderHome(); } };
}

function renderWords(){
  const w = W();
  const groups = {};
  (w.vocab||[]).forEach(v=>{ (groups[v.tema||"Ord"] = groups[v.tema||"Ord"]||[]).push(v); });
  app.innerHTML = `
    <div class="topline"><button class="iconbtn" id="back" aria-label="Tilbake">←</button><b>Ukens ord · ${esc(w.label)}</b></div>
    ${Object.keys(groups).map(g=>`<div class="card"><h2>${esc(g)}</h2><table class="wordlist">
      ${groups[g].map(v=>`<tr><td>${jpHTML(v,false)}</td><td>${esc(v.no)}</td><td style="text-align:right">${speakBtn(v.jp)}</td></tr>`).join("")}
    </table></div>`).join("")}`;
  $("#back").onclick = renderHome;
  bindSpeak();
}

$("#btnSettings").onclick = renderSettings;
$("#btnWords").onclick = renderWords;
window.__pickDailyIds = pickDailyIds;
window.__DAILY_POOL = DAILY_POOL;
window.__PLACES = PLACES;
window.__setDate = s=>{ DATE_OVERRIDE=s||null; };
window.__allQuestions = allQuestionMap;
renderHome();
</script>
